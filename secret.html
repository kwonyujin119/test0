<!doctype html>
<html lang="ko" data-ws="secret">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>SECRET</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23e6f4f1'/><text x='50' y='69' font-size='54' text-anchor='middle' fill='%231c6b5c' font-family='sans-serif' font-weight='700'>S</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script>try{var t=localStorage.getItem('ws:theme');if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="app/ui.css">
<link rel="stylesheet" href="app/hub.css">
<link rel="stylesheet" href="app/secret/secret.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="app/icons/icon-192.png">
</head>
<body>
<div id="scGate" hidden>
  <div class="sc-gate">
    <span class="mark" aria-hidden="true">S</span>
    <h1>SECRET 은 관리자만 씁니다</h1>
    <p>게스트 모드에서는 열 수 없습니다. 접속코드를 입력해 주세요.</p>
    <div class="sc-row"><a class="btn" href="index.html"><i data-ic="back"></i>DPV로</a><button class="btn ink" id="gateIn"><i data-ic="key"></i>관리자로 입장</button></div>
  </div>
</div>
<div class="shell" id="scApp" hidden>
  <aside class="rail" aria-label="SECRET 메뉴">
    <a class="brand" href="secret.html"><span class="mark">S</span><b>SECRET</b></a>
    <div class="rail-role" id="roleChip"></div>
    <button class="btn ink wide" id="btnNew"><i data-ic="plus"></i>새 대화</button>
    <nav class="rail-nav" id="nav" aria-label="SECRET 화면">
      <button class="rail-item on" data-view="chat"><i data-ic="chat"></i><span>AI 어시스턴트</span></button>
      <button class="rail-item" data-view="watch"><i data-ic="trend"></i><span>관심 종목 · 보유</span><em id="cWatch"></em></button>
      <button class="rail-item" data-view="calc"><i data-ic="calc"></i><span>매매 계획 계산기</span></button>
      <button class="rail-item" data-view="refs"><i data-ic="book"></i><span>레퍼런스 · 원칙</span></button>
    </nav>
    <div class="sc-chats" id="chatList" aria-label="최근 대화"></div>
    <div class="rail-grow"></div>
    <nav class="rail-nav quiet" aria-label="도구">
      <button class="rail-item" data-view="apis"><i data-ic="key"></i><span>API 연결</span><em id="cApi"></em></button>
      <a class="rail-item" href="index.html"><i data-ic="back"></i><span>DPV로</span></a>
    </nav>
  </aside>

  <main class="sc-main">
    <!-- AI 어시스턴트 -->
    <section class="sc-view sc-chat" id="vChat">
      <header class="sc-bar">
        <h1 id="chatTitle">AI 어시스턴트</h1>
        <div class="sc-tools">
          <label class="sc-ai" title="대화에 쓸 AI"><i data-ic="sparkle"></i><select id="aiSel" aria-label="대화에 쓸 AI"></select></label>
          <label class="sc-toggle" id="webWrap" title="Claude 가 웹을 검색해 최신 뉴스 · 공시를 찾아 근거로 씁니다"><input type="checkbox" id="webOn"><span>웹 검색</span></label>
          <button class="btn icon ghost" data-ui-theme title="화면을 어둡게"></button>
        </div>
      </header>
      <div class="sc-msgs" id="msgs" aria-live="polite"></div>
      <form class="sc-compose" id="compose">
        <div class="sc-input">
          <textarea id="q" rows="1" placeholder="종목 · 시장 · 매매 계획을 물어보세요" title="Enter 보내기 · Shift+Enter 줄바꿈" aria-label="질문"></textarea>
          <button class="btn ink icon" id="btnSend" type="submit" title="보내기" aria-label="보내기"><i data-ic="send"></i></button>
          <button class="btn icon" id="btnStop" type="button" title="멈추기" aria-label="멈추기" hidden><i data-ic="stop"></i></button>
        </div>
        <p class="sc-fine">AI 답변은 틀릴 수 있습니다. 숫자는 시세 API · 웹에서 가져온 것만 믿고, 투자 판단과 책임은 본인에게 있습니다.</p>
      </form>
    </section>

    <!-- 관심 종목 · 보유 -->
    <section class="sc-view sc-page" id="vWatch" hidden>
      <header class="sc-bar"><h1>관심 종목 · 보유</h1>
        <div class="sc-tools">
          <button class="btn" id="wRefresh"><i data-ic="refresh"></i>시세 새로 고침</button>
          <button class="btn" id="wAsk"><i data-ic="sparkle"></i>AI 점검</button>
          <button class="btn ink" id="wAdd"><i data-ic="plus"></i>종목 추가</button>
        </div>
      </header>
      <div class="sc-sum" id="wSum"></div>
      <div class="sc-tablewrap"><table class="sc-table" id="wTable"></table></div>
      <p class="sc-fine" id="wNote"></p>
    </section>

    <!-- 매매 계획 계산기 -->
    <section class="sc-view sc-page" id="vCalc" hidden>
      <header class="sc-bar"><h1>매매 계획 계산기</h1><div class="sc-tools"><button class="btn" id="cAsk"><i data-ic="sparkle"></i>이 계획을 AI 에게 검토 받기</button></div></header>
      <p class="sc-lead">한 번에 잃어도 되는 금액을 먼저 정하고, 손절가에서 거꾸로 수량을 정합니다. 손익비와 승률로 이 매매의 기대값도 봅니다.</p>
      <div class="sc-calc">
        <form class="sc-card" id="calcForm">
          <label>종목 (선택)<input type="text" id="cSym" placeholder="예: AAPL, 005930"></label>
          <label>계좌 금액<input type="number" id="cAcc" min="0" step="any" placeholder="10000000"></label>
          <label>한 번에 감수할 손실 (%)<input type="number" id="cRisk" min="0.1" max="10" step="0.1" value="1"></label>
          <label>진입가<input type="number" id="cEntry" min="0" step="any"></label>
          <label>손절가<input type="number" id="cStop" min="0" step="any"></label>
          <label>목표가<input type="number" id="cTarget" min="0" step="any"></label>
          <label>예상 승률 (%)<input type="number" id="cWin" min="1" max="99" step="1" value="45"></label>
        </form>
        <div class="sc-card sc-out" id="calcOut"></div>
      </div>
    </section>

    <!-- 레퍼런스 · 원칙 -->
    <section class="sc-view sc-page" id="vRefs" hidden>
      <header class="sc-bar"><h1>레퍼런스 · 원칙</h1></header>
      <div id="refs"></div>
    </section>

    <!-- API 연결 -->
    <section class="sc-view sc-page" id="vApis" hidden>
      <header class="sc-bar"><h1>API 연결</h1><div class="sc-tools"><button class="btn ink" id="apiAdd"><i data-ic="plus"></i>API 추가</button></div></header>
      <div class="hub-notice" id="apiNote"></div>
      <div class="sc-apis" id="apiGrid"></div>
      <div class="sc-card sc-lock" id="lockBox"></div>
    </section>
  </main>
</div>
<script src="app/common.js"></script>
<script src="app/access.js"></script>
<script src="app/secret/secret.js"></script>
<script src="app/pwa.js"></script>
</body>
</html>
