<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>DPV</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%2316171a'/><text x='50' y='61' font-size='34' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'>DPV</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script>try{var t=localStorage.getItem('ws:theme');if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="app/ui.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="app/icons/icon-192.png">
<style>
/* DPV 첫 화면 — 가운데 둥근 심벌 하나. 마우스를 올리거나(PC) 누르면(휴대폰) 탭 넷이 11 · 1 · 5 · 7시 방향으로 떠오름 */
html, body { height: 100%; }
body { margin: 0; background: var(--ui-bg); color: var(--ui-fg); overflow: hidden; }
.home { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; }
.home::before { /* 은은한 바탕 원 — 심벌 둘레만 살짝 밝게 */
  content: ''; position: absolute; left: 50%; top: 50%; width: min(760px, 150vw); aspect-ratio: 1; transform: translate(-50%, -50%);
  background: radial-gradient(closest-side, color-mix(in srgb, var(--ui-fg) 6%, transparent), transparent); pointer-events: none; }

/* 궤도: 이 상자 안에 마우스가 있는 동안은 열려 있음 (탭으로 옮겨 가는 사이에 닫히지 않게) */
.orbit { --r: 190px; --dx: calc(var(--r) * .5); --dy: calc(var(--r) * .866);
  position: relative; width: calc(var(--r) + 300px); height: calc(var(--r) * 1.732 + 120px); max-width: 100%; display: grid; place-items: center; }

.hub { position: relative; z-index: 2; width: 128px; height: 128px; border-radius: 50%; border: 0; cursor: pointer; padding: 0;
  background: var(--ui-ink); color: var(--ui-on-ink); font-family: inherit; font-weight: 800; font-size: 30px; line-height: 1; letter-spacing: .04em;
  box-shadow: 0 10px 30px rgba(0,0,0,.18), 0 0 0 8px color-mix(in srgb, var(--ui-ink) 10%, transparent);
  transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s; display: grid; place-items: center; }
.hub::after { /* 숨쉬는 테두리: 닫혀 있을 때만, 여기를 건드리라는 표시 */
  content: ''; position: absolute; inset: -8px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--ui-ink) 35%, transparent);
  animation: breathe 2.6s ease-in-out infinite; pointer-events: none; }
@keyframes breathe { 0%, 100% { transform: scale(1); opacity: .7; } 50% { transform: scale(1.12); opacity: 0; } }
.hub:focus-visible { outline: 3px solid var(--ui-accent); outline-offset: 6px; }
.hint { position: absolute; z-index: 1; top: calc(50% + 86px); left: 50%; transform: translateX(-50%); white-space: nowrap;
  font-size: 13px; color: var(--ui-muted); transition: opacity .2s; pointer-events: none; }

.tab { --x: 0px; --y: 0px; position: absolute; left: 50%; top: 50%; z-index: 3;
  display: flex; align-items: center; gap: 10px; padding: 10px 18px 10px 10px; border-radius: 999px; text-decoration: none; cursor: pointer;
  background: var(--ws-bg); color: var(--ws-fg); border: 1px solid var(--ws-line); font-family: inherit; font-weight: 700; font-size: 16px; line-height: 1; letter-spacing: .03em;
  box-shadow: 0 8px 24px rgba(0,0,0,.12);
  opacity: 0; pointer-events: none; transform: translate(-50%, -50%) scale(.4);
  transition: transform .34s cubic-bezier(.2,.9,.25,1.15), opacity .2s, box-shadow .2s; transition-delay: 0s; }
.tab .tile { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--ws-dot); color: #fff; font-weight: 800; font-size: 15px; }
.tab small { display: block; font-weight: 500; font-size: 11.5px; letter-spacing: 0; opacity: .8; margin-top: 3px; }
.tab[data-pos="11"] { --x: calc(var(--dx) * -1); --y: calc(var(--dy) * -1); }
.tab[data-pos="1"]  { --x: var(--dx);            --y: calc(var(--dy) * -1); }
.tab[data-pos="5"]  { --x: var(--dx);            --y: var(--dy); }
.tab[data-pos="7"]  { --x: calc(var(--dx) * -1); --y: var(--dy); }
.tab.locked { filter: saturate(.55); }

/* 열림: PC 는 마우스를 올리면, 키보드는 심벌에 초점이 오면, 휴대폰은 누르면(.open) */
@media (hover: hover) {
  .orbit:hover .tab { opacity: 1; pointer-events: auto; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1); }
  .orbit:hover .hint { opacity: 0; }
  .orbit:hover .hub::after { animation: none; opacity: 0; }
  .orbit:hover .hub { transform: scale(.92); }
  .orbit:hover .rays i { transform: rotate(var(--a)) scaleX(1); }
}
.orbit:focus-within .tab, .orbit.open .tab { opacity: 1; pointer-events: auto; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1); }
.orbit:focus-within .hint, .orbit.open .hint { opacity: 0; }
.orbit.open .hub::after, .orbit:focus-within .hub::after { animation: none; opacity: 0; }
.orbit.open .hub, .orbit:focus-within .hub { transform: scale(.92); }
/* 하나씩 시계 방향으로 (11 → 1 → 5 → 7) */
.orbit:hover .tab[data-pos="1"], .orbit.open .tab[data-pos="1"], .orbit:focus-within .tab[data-pos="1"] { transition-delay: .04s; }
.orbit:hover .tab[data-pos="5"], .orbit.open .tab[data-pos="5"], .orbit:focus-within .tab[data-pos="5"] { transition-delay: .08s; }
.orbit:hover .tab[data-pos="7"], .orbit.open .tab[data-pos="7"], .orbit:focus-within .tab[data-pos="7"] { transition-delay: .12s; }
.tab:hover, .tab:focus-visible { box-shadow: 0 12px 30px rgba(0,0,0,.18), 0 0 0 2px var(--ws-dot); outline: none; }
.orbit .tab:hover { transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1.06); transition-delay: 0s; }

/* 심벌과 탭을 잇는 가는 선 (열렸을 때만) */
.rays { position: absolute; left: 50%; top: 50%; width: 0; height: 0; z-index: 1; pointer-events: none; }
.rays i { position: absolute; left: 0; top: 0; width: var(--r); height: 1.5px; transform-origin: 0 50%; background: linear-gradient(90deg, transparent 30%, color-mix(in srgb, var(--ui-fg) 18%, transparent));
  transform: rotate(var(--a)) scaleX(0); transition: transform .3s ease; }
.rays i:nth-child(1) { --a: -120deg; } .rays i:nth-child(2) { --a: -60deg; } .rays i:nth-child(3) { --a: 60deg; } .rays i:nth-child(4) { --a: 120deg; }
.orbit.open .rays i, .orbit:focus-within .rays i { transform: rotate(var(--a)) scaleX(1); }

/* 구석: 지금 모드 · 관리자 입장 · 화면 밝기 */
.corner { position: fixed; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); display: flex; gap: 8px; align-items: center; z-index: 5; font-size: 13px; }
.corner .lnk { background: none; border: 0; color: var(--ui-muted); font: inherit; cursor: pointer; padding: 8px 6px; text-decoration: underline; text-underline-offset: 3px; }
.corner .lnk:hover { color: var(--ui-fg); }
.mode { position: fixed; left: 16px; bottom: max(24px, env(safe-area-inset-bottom)); z-index: 5; font-size: 13px; color: var(--ui-muted); }
.mode b { color: var(--ui-fg); font-weight: 600; }

@media (max-width: 560px) {
  .orbit { --r: 150px; width: 100%; }
  .hub { width: 104px; height: 104px; font-size: 25px; }
  .hint { top: calc(50% + 72px); }
  .tab { padding: 8px 14px 8px 8px; font-size: 14.5px; }
  .tab small { display: none; }
  .tab .tile { width: 30px; height: 30px; font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) {
  .hub::after { animation: none; }
  .tab, .rays i, .hub { transition-duration: .01s !important; transition-delay: 0s !important; }
}
</style>
</head>
<body>
<main class="home">
  <h1 class="sr-only">DPV — 작업장 고르기</h1>
  <nav class="orbit" id="orbit" aria-label="작업장">
    <div class="rays" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <button type="button" class="hub" id="hub" aria-expanded="false" aria-label="DPV — 작업장 열기">DPV</button>
    <span class="hint" id="hint">마우스를 올려 작업장을 고르세요</span>
    <a class="tab" data-pos="11" data-ws="doc" href="hangul.html"><span class="tile" aria-hidden="true">D</span><span>DOC<small>한글 문서</small></span></a>
    <a class="tab" data-pos="1" data-ws="pres" href="gyoan.html"><span class="tile" aria-hidden="true">P</span><span>PRES<small>교안 · 발표</small></span></a>
    <a class="tab" data-pos="5" data-ws="video" href="videos.html"><span class="tile" aria-hidden="true">V</span><span>VIDEO<small>영상</small></span></a>
    <a class="tab" data-pos="7" data-ws="secret" href="secret.html" id="tabSecret"><span class="tile" aria-hidden="true">S</span><span>SECRET<small>관리자 전용</small></span></a>
  </nav>
</main>
<div class="mode" id="mode"></div>
<div class="corner"><button type="button" class="lnk" id="btnMode"></button><button class="btn icon ghost" data-ui-theme title="화면을 어둡게"></button></div>

<script src="app/common.js"></script>
<script src="app/access.js"></script>
<script>
/* 탭을 누르면 게스트(보기 전용)로 입장. 이미 관리자로 들어온 기기는 관리자 그대로 둠 (누를 때마다 게스트로 내려가면 관리자가 일을 못 함).
   SECRET 은 게스트에게 열지 않고 "관리자에게 문의하세요." 만 띄움.
   관리자 입장은 오른쪽 아래 작은 링크. 다른 화면의 모드 표식(index.html?mode=1)을 눌러 오면 접속코드 창을 바로 띄움 */
(() => {
  const $ = id => document.getElementById(id);
  const orbit = $('orbit'), hub = $('hub');
  if (matchMedia('(hover: none)').matches) $('hint').textContent = '눌러서 작업장을 고르세요';

  const setOpen = on => { orbit.classList.toggle('open', on); hub.setAttribute('aria-expanded', on ? 'true' : 'false'); };
  hub.addEventListener('click', () => setOpen(!orbit.classList.contains('open')));
  document.addEventListener('click', e => { if (!orbit.contains(e.target)) setOpen(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { setOpen(false); if (orbit.contains(document.activeElement)) document.activeElement.blur(); } });

  orbit.querySelectorAll('.tab').forEach(a => a.addEventListener('click', e => {
    if (a.dataset.ws === 'secret' && !Access.isAdmin) { e.preventDefault(); toast('관리자에게 문의하세요.', 2600); return; }
    if (!Access.isAdmin) Access.enterGuest();
  }));

  function paint() {
    const admin = Access.isAdmin;
    $('mode').innerHTML = Access.chosen ? `지금: <b>${admin ? '관리자' : '게스트 · 보기 전용'}</b>` : '';
    $('btnMode').textContent = admin ? '게스트로 바꾸기' : '관리자로 입장';
    $('tabSecret').classList.toggle('locked', !admin);
    $('tabSecret').querySelector('small').textContent = admin ? '투자 도우미' : '관리자 전용';
  }
  async function toAdmin() { if (await Access.prompt()) { toast('관리자로 입장했습니다', 2000); paint(); } }
  $('btnMode').onclick = () => { if (Access.isAdmin) { Access.enterGuest(); toast('게스트(보기 전용)로 바꿨습니다', 2000); paint(); } else toAdmin(); };
  paint();
  if (new URLSearchParams(location.search).has('mode') && !Access.isAdmin) setTimeout(toAdmin, 150);
})();
</script>
<script src="app/pwa.js"></script>
</body>
</html>
