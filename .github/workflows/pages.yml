# main 브랜치에 푸시될 때마다 GitHub Pages 로 배포
# → https://kwonyujin119.github.io/test0/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # 화면 스크립트에 문법 오류가 있으면 배포하지 않음 → 사이트는 마지막으로 잘 되던 판 그대로 (한 줄 실수로 앱이 통째로 안 열리는 일 방지)
      - name: Check JavaScript syntax
        run: |
          bad=0
          for f in $(git ls-files '*.js'); do node --check "$f" || bad=1; done
          exit $bad
      # 한 화면이 불러오는 스크립트끼리 같은 이름을 두 번 선언하면 뒤 스크립트가 멈춤 (문법 검사로는 안 잡힘)
      - name: Check duplicate top-level names
        run: node tools/check-globals.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
