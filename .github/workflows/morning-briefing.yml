# SECRET 모닝 브리핑 — 매일 아침 6시부터 7시 45분까지 여러 번 보강해 8시(한국) 전에 그날 것을 완성한다.
# 같은 날 다시 돌면 그날 파일을 새 뉴스로 덮어쓴다 (뒤에 나온 기사까지 합쳐 다시 고름).
# (이전 설명) 매일 아침 7시(한국) 전에 뉴스 피드 19곳에서 중요도 순 5개씩(약 95개)과 전체 큰 이슈 15개를 모아 briefing 브랜치에 저장한다.
# AI(Claude 등) 토큰을 쓰지 않는다: 뉴스 피드를 모아 "여러 언론이 함께 다룬 정도 + 시장 핵심어"로 고른다 (.github/scripts/morning_briefing.py).
# 결과는 main 이 아니라 briefing 브랜치에 쌓이므로 사이트 배포 · 교안 저장과 섞이지 않는다.
# SECRET 화면은 https://raw.githubusercontent.com/<저장소>/briefing/latest.json 을 읽는다.
name: Morning briefing

on:
  schedule:
    # GitHub 예약 실행은 몰리는 시간에 몇 시간씩 밀릴 수 있어(11/9: 06:30 예정 → 10:08), 정각 · 30분을 피해 일찍부터 여러 번 돌림
    - cron: '7 20 * * *'    # 05:07 한국 시간
    - cron: '53 20 * * *'   # 05:53
    - cron: '31 21 * * *'   # 06:31
    - cron: '9 22 * * *'    # 07:09
    - cron: '37 22 * * *'   # 07:37 — 8시 전 마지막 보강
    - cron: '23 23 * * *'   # 08:23 — 그날 것이 늦었을 때 보충
    - cron: '47 0 * * *'    # 09:47 — 보충
  workflow_dispatch:         # Actions 화면에서 [Run workflow] 로 바로 실행
  push:                      # .github/briefing-run.txt 를 바꿔 main 에 올리면 바로 실행
    branches: [main]
    paths: ['.github/briefing-run.txt']         # Actions 화면에서 [Run workflow] 로 바로 실행

permissions:
  contents: write

concurrency:
  group: briefing-branch     # 전략 브리핑과 같은 브랜치에 쓰므로 한 번에 하나씩
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 스크립트만 가져오기
        uses: actions/checkout@v4
        with:
          path: src
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: briefing 브랜치 가져오기 (없으면 새로 만듦)
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads "$REPO_URL" briefing >/dev/null; then
            git clone --depth 1 --branch briefing "$REPO_URL" pub
          else
            mkdir pub && cd pub && git init -b briefing && git remote add origin "$REPO_URL"
          fi

      - name: 뉴스 모아 15개 고르기
        run: python3 src/.github/scripts/morning_briefing.py --out pub -v

      - name: 저장
        run: |
          cd pub
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -m "모닝 브리핑 $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3; do git push origin HEAD:briefing && exit 0; git pull --rebase origin briefing || true; sleep 5; done
          exit 1
