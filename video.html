<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>영상 작업장</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%2316171a'/><text x='50' y='69' font-size='54' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'>영</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script>try{var t=localStorage.getItem('ws:theme');if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="app/ui.css">
<link rel="stylesheet" href="app/hub.css">
<link rel="stylesheet" href="app/video/video.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="app/icons/icon-192.png">
</head>
<body class="ve-panel-open">
<div id="veGate" hidden>
  <div class="ve-gate">
    <span class="mark" aria-hidden="true">영</span>
    <h1>영상 작업장은 관리자만 씁니다</h1>
    <p>게스트 모드는 보기 전용입니다. 영상을 편집하려면 접속코드를 입력해 주세요.</p>
    <div class="ve-row"><a class="btn" href="index.html"><i data-ic="back"></i>업무 공간으로</a><button class="btn ink" id="gateIn"><i data-ic="key"></i>관리자로 입장</button></div>
  </div>
</div>
<div class="ve-app" id="veApp">
  <header class="ve-top">
    <a class="ve-crumb" href="index.html" title="업무 공간으로"><i data-ic="back"></i><span class="mark" aria-hidden="true">영</span><span>영상 작업장</span></a>
    <span class="sep"></span>
    <input class="ve-name" id="veName" type="text" value="새 영상" aria-label="프로젝트 이름" spellcheck="false">
    <span class="ve-save" id="veSave"></span>
    <span class="ve-grow"></span>
    <span class="ve-rec-badge" id="veRecBadge" hidden>녹화 중</span>
    <button class="btn icon ghost" id="btnUndo" title="되돌리기 (Ctrl+Z)" aria-label="되돌리기"><i data-ic="undo"></i></button>
    <button class="btn icon ghost" id="btnRedo" title="다시 하기 (Ctrl+Y)" aria-label="다시 하기"><i data-ic="redo"></i></button>
    <button class="btn icon ghost" data-ui-theme title="화면을 어둡게"></button>
    <button class="btn icon ghost" id="veBtnProps" title="속성 칸" aria-label="속성 칸"><i data-ic="sliders"></i></button>
    <button class="btn ghost" id="btnProjects" title="내 프로젝트"><i data-ic="folder"></i><span>프로젝트</span></button>
    <button class="btn ink" id="btnExport"><i data-ic="export"></i>내보내기</button>
  </header>
  <nav class="ve-rail" id="veRail" aria-label="작업 메뉴"></nav>
  <aside class="ve-panel" id="vePanel"></aside>
  <main class="ve-stage-wrap">
    <div class="ve-stage" id="veStage">
      <canvas id="veCanvas" width="1280" height="720" aria-label="미리보기"></canvas>
      <div class="ve-empty-state" id="veEmpty">
        <div class="pic"><i data-ic="film"></i></div>
        <h2>영상을 넣어 시작하세요</h2>
        <p>창 어디든 파일을 끌어다 놓아도 됩니다.<br>파일은 이 기기 안에서만 처리합니다.</p>
        <div class="ve-row"><button class="btn ink" id="btnImportEmpty"><i data-ic="upload"></i>파일 넣기</button><button class="btn" id="btnRecEmpty"><i data-ic="record"></i>화면 녹화</button></div>
      </div>
    </div>
    <div class="ve-transport">
      <input type="range" class="ve-seek" id="veSeek" min="0" max="1000" step="1" value="0" aria-label="재생 위치">
      <div class="ve-tc"><b id="tcNow">0:00.0</b> <span>/ <span id="tcAll">0:00</span></span></div>
      <div class="ve-tbtns">
        <button class="btn hide-sm" id="btnStart" title="맨 앞으로 (Home)" aria-label="맨 앞으로"><i data-ic="skipB"></i></button>
        <button class="btn" id="btnPrev" title="한 장면 앞으로 (←)" aria-label="한 장면 앞으로"><i data-ic="stepB"></i></button>
        <button class="btn ve-play" id="btnPlay" title="재생 (Space)" aria-label="재생"></button>
        <button class="btn" id="btnNext" title="한 장면 뒤로 (→)" aria-label="한 장면 뒤로"><i data-ic="stepF"></i></button>
        <button class="btn hide-sm" id="btnEnd" title="맨 뒤로 (End)" aria-label="맨 뒤로"><i data-ic="skipF"></i></button>
      </div>
      <div class="r">
        <button class="btn icon ghost" id="btnMute" title="소리 끄기 (M)" aria-label="소리 끄기"><i data-ic="volume"></i></button>
        <button class="btn icon ghost" id="btnFull" title="크게 보기 (F)" aria-label="크게 보기"><i data-ic="expand"></i></button>
      </div>
    </div>
  </main>
  <aside class="ve-props" id="veProps"></aside>
  <div class="ve-split" id="veSplit" title="끌어서 타임라인 높이 바꾸기"></div>
  <section class="ve-tl" id="veTimeline" aria-label="타임라인">
    <div class="ve-tlbar">
      <button class="btn sm" id="tlSplit" title="재생 위치에서 자르기"><i data-ic="scissors"></i>자르기<kbd>S</kbd></button>
      <button class="btn sm" id="tlDelete" title="고른 것 지우기"><i data-ic="trash"></i>지우기<kbd>Del</kbd></button>
      <span class="sep"></span>
      <button class="btn sm" id="tlHead" title="재생 위치의 앞부분 지우기">앞 지우기<kbd>Q</kbd></button>
      <button class="btn sm" id="tlTail" title="재생 위치의 뒷부분 지우기">뒤 지우기<kbd>W</kbd></button>
      <span class="sep"></span>
      <button class="btn sm" id="tlSnap" title="클립 끝과 재생 위치에 달라붙기"><i data-ic="magnet"></i>달라붙기</button>
      <div class="ve-tlzoom">
        <button class="btn sm ghost" id="tlFit" title="전체가 보이게"><i data-ic="fit"></i>전체 보기</button>
        <input type="range" id="tlZoom" min="0" max="100" value="50" aria-label="타임라인 확대">
      </div>
    </div>
    <canvas id="tlCanvas"></canvas>
  </section>
</div>
<div id="vePool" aria-hidden="true"></div>
<div class="ve-dropover" id="veDropOver" hidden>놓으면 타임라인에 넣습니다</div>
<div class="ve-busy" id="veBusy" hidden></div>
<div class="ve-count" id="veCount" hidden></div>
<script src="app/common.js"></script>
<script src="app/access.js"></script>
<script src="app/video/dsp.js"></script>
<script src="app/video/core.js"></script>
<script src="app/video/chars.js"></script>
<script src="app/video/render.js"></script>
<script src="app/video/swap.js"></script>
<script src="app/video/player.js"></script>
<script src="app/video/timeline.js"></script>
<script src="app/video/tools.js"></script>
<script src="app/video/voices.js"></script>
<script src="app/video/export.js"></script>
<script src="app/video/rec.js"></script>
<script src="app/video/panels.js"></script>
<script src="app/video/app.js"></script>
<script src="app/pwa.js"></script>
</body>
</html>
