<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D 파티클 나무</title>
<style>
html, body { margin: 0; height: 100%; background: #04060B; overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; }
</style></head><body>
<canvas id="c"></canvas>
<script>
/* 빛 알갱이로 된 3D 나무 — 라이브러리 없이 Canvas 2D 로.
   주소 끝 옵션: ?x=0.66 (나무 가로 위치 0~1) · &grow=0 (자라는 장면 없이) · &still=1 (멈춘 한 장면) */
(function () {
  const q = new URLSearchParams(location.search);
  const CX = +(q.get('x') || 0.66), GROW = q.get('grow') !== '0';
  const STILL = q.get('still') === '1' || matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv = document.getElementById('c'), g = cv.getContext('2d');
  let W = 0, H = 0, DPR = Math.min(1.5, devicePixelRatio || 1);
  function size() { W = cv.width = Math.round(innerWidth * DPR); H = cv.height = Math.round(innerHeight * DPR); }
  addEventListener('resize', size); size();

  /* 난수 (매번 같은 나무) */
  let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  /* 나무: 가지를 3D 로 갈라 내고, 끝마다 잎 무리 */
  const twigs = [], leaves = [];
  const PAL = [[150, 230, 70], [120, 210, 90], [40, 200, 255], [70, 150, 255], [255, 70, 150], [255, 110, 190]];
  function branch(x, y, z, dx, dy, dz, len, depth, gen) {
    const ex = x + dx * len, ey = y + dy * len, ez = z + dz * len;
    const n = Math.max(6, Math.round(len * 0.16));
    for (let i = 0; i < n; i++) { const t = i / n; twigs.push({ x: x + (ex - x) * t, y: y + (ey - y) * t, z: z + (ez - z) * t, w: Math.max(1, depth * 0.9), d: gen + t }); }
    if (depth <= 1) {
      const pal = ex > 25 ? (ez > 0 ? 3 : 2) : ex < -95 ? 4 : 0; // 오른쪽은 파랑, 왼쪽 끝은 분홍(나중에 퍼짐), 나머지 초록
      for (let i = 0; i < 46; i++) {
        const r = 30 * Math.cbrt(rnd()), a = rnd() * 6.283, b = Math.acos(2 * rnd() - 1);
        leaves.push({ x: ex + r * Math.sin(b) * Math.cos(a), y: ey + r * Math.cos(b) * 0.8 - 6, z: ez + r * Math.sin(b) * Math.sin(a), c: pal + (rnd() < .4 ? 1 : 0), d: gen + 1, ph: rnd() * 6.283, k: 0.5 + rnd() });
      }
      return;
    }
    const kids = depth > 5 ? 2 : depth > 3 ? 3 : 2;
    for (let i = 0; i < kids; i++) {
      const sp = 0.55 + rnd() * 0.45, rot = rnd() * 6.283;
      let nx = dx * 0.6 + Math.cos(rot) * sp * 1.3, ny = dy * 0.5 + 0.25 + rnd() * 0.25, nz = dz * 0.6 + Math.sin(rot) * sp * 1.3;
      const m = Math.hypot(nx, ny, nz); branch(ex, ey, ez, nx / m, ny / m, nz / m, len * (0.68 + rnd() * 0.12), depth - 1, gen + 1);
    }
  }
  branch(0, 0, 0, 0.05, 1, 0, 95, 6, 0);
  const maxD = Math.max(...leaves.map(l => l.d));
  /* 별 */
  const stars = Array.from({ length: 160 }, () => ({ x: rnd(), y: rnd() * 0.7, a: rnd() }));
  /* 빛 알갱이 그림 (색마다 하나 미리) */
  const sprite = PAL.map(([r, gg, b]) => { const s = document.createElement('canvas'); s.width = s.height = 32; const c = s.getContext('2d'); const gr = c.createRadialGradient(16, 16, 0, 16, 16, 16); gr.addColorStop(0, `rgba(${Math.min(255,r+90)},${Math.min(255,gg+90)},${Math.min(255,b+90)},0.9)`); gr.addColorStop(0.22, `rgba(${r},${gg},${b},0.7)`); gr.addColorStop(0.55, `rgba(${r},${gg},${b},0.14)`); gr.addColorStop(1, `rgba(${r},${gg},${b},0)`); c.fillStyle = gr; c.fillRect(0, 0, 32, 32); return s; });
  const trunk = (() => { const s = document.createElement('canvas'); s.width = s.height = 32; const c = s.getContext('2d'); const gr = c.createRadialGradient(16, 16, 0, 16, 16, 16); gr.addColorStop(0, 'rgba(200,255,220,.9)'); gr.addColorStop(.4, 'rgba(90,170,140,.35)'); gr.addColorStop(1, 'rgba(60,120,100,0)'); c.fillStyle = gr; c.fillRect(0, 0, 32, 32); return s; })();

  const t0 = performance.now();
  function frame(now) {
    const t = STILL ? 4 : (now - t0) / 1000;
    const grow = GROW && !STILL ? Math.min(1, t / 3.2) : 1;
    const ang = 0.35 + t * 0.06, ca = Math.cos(ang), sa = Math.sin(ang);
    const S = H / 400, ox = W * CX, oy = H * 0.93, cam = 520;
    /* 바탕 */
    const bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#04060B'); bg.addColorStop(0.62, '#070B14'); bg.addColorStop(1, '#0A1220');
    g.globalCompositeOperation = 'source-over'; g.fillStyle = bg; g.fillRect(0, 0, W, H);
    for (const s of stars) { g.globalAlpha = 0.25 + 0.35 * Math.abs(Math.sin(t * 0.7 + s.a * 9)); g.fillStyle = '#BFD0FF'; g.fillRect(s.x * W, s.y * H, 1.4 * DPR, 1.4 * DPR); }
    /* 바닥 파동 */
    g.globalAlpha = 1; g.lineWidth = 1.2 * DPR;
    for (let i = 0; i < 5; i++) { const p = ((t * 0.18 + i / 5) % 1); g.strokeStyle = `rgba(120,200,190,${0.35 * (1 - p)})`; g.beginPath(); g.ellipse(ox, oy, (40 + p * 420) * S, (8 + p * 70) * S, 0, 0, 6.283); g.stroke(); }
    g.globalCompositeOperation = 'lighter';
    const proj = (x, y, z) => { const rx = x * ca - z * sa, rz = x * sa + z * ca; const k = cam / (cam + rz); return [ox + rx * k * S, oy - y * k * S, k]; };
    /* 가지 */
    for (const p of twigs) {
      if (p.d / (maxD + 1) > grow * 1.05) continue;
      const [X, Y, k] = proj(p.x, p.y, p.z), r = (2 + p.w * 1.6) * k * S;
      g.globalAlpha = 0.55; g.drawImage(trunk, X - r, Y - r, r * 2, r * 2);
    }
    /* 잎: 분홍이 8초마다 왼쪽부터 번져 나감 */
    const w = (t % 16) / 16, spread = w < 0.35 ? 0 : w < 0.65 ? (w - 0.35) / 0.3 : w < 0.85 ? 1 : 1 - (w - 0.85) / 0.15;
    for (const l of leaves) {
      const show = Math.min(1, Math.max(0, (grow * (maxD + 1) - l.d + 1)));
      if (show <= 0) continue;
      let c = l.c;
      if (c < 4 && l.k > 0.95 && (l.x + 170) / 380 < spread * 1.15 - 0.1) c = 4 + (l.c & 1); // 퍼지는 새 색
      const [X, Y, k] = proj(l.x + Math.sin(t * 0.8 + l.ph) * 1.5, l.y + Math.cos(t * 0.6 + l.ph) * 1.5, l.z);
      const r = (5.2 * l.k) * k * S * (0.85 + 0.15 * Math.sin(t * 2 + l.ph));
      g.globalAlpha = show * (0.28 + 0.3 * Math.sin(t * 1.3 + l.ph * 2) ** 2);
      g.drawImage(sprite[c], X - r, Y - r, r * 2, r * 2);
    }
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
    if (!STILL) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  /* 발표 화면 안(같은 사이트)에 넣었을 때: 키 · 클릭을 발표 화면으로 넘겨 장 넘기기가 막히지 않게 */
  if (window.parent !== window) {
    const fwd = (key, ev) => { try { parent.document.dispatchEvent(new KeyboardEvent('keydown', { key, code: ev && ev.code, shiftKey: ev && ev.shiftKey, ctrlKey: ev && ev.ctrlKey, bubbles: true })); parent.focus(); } catch (e) { } };
    addEventListener('keydown', (ev) => { ev.preventDefault(); fwd(ev.key, ev); });
    addEventListener('click', () => fwd('ArrowRight'));
  }
})();
</script>
</body></html>
