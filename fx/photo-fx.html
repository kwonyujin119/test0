<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>사진에 생명 넣기</title>
<style>html, body { margin: 0; height: 100%; background: #05060A; overflow: hidden; } canvas { display: block; width: 100%; height: 100%; }</style>
</head><body><canvas id="c"></canvas>
<script>
/* 사진 한 장을 살아 있는 장면으로 — WebGL 셰이더로 사진 위에 움직임을 얹음 (라이브러리 없음)
   ?img=assets/fx-fireground.jpg &mode=fireground  : 불꽃 일렁임 · 열 아지랑이 · 경광등 빨강/파랑 번쩍임(건물·젖은 길에 비침) · 불티 · 연기 흐름
   ?img=assets/fx-water.jpg      &mode=water       : 물줄기 흐름 · 튀는 물방울 · 수증기 · 바닥 물보라 · 불꽃 일렁임
   ?img=assets/아무사진.jpg       &mode=ambient     : 어느 사진이든 — 초점 맞은 곳이 더 움직이는 입체감 · 빛 훑기 · 떠다니는 먼지 · 밝은 곳 반짝임

(function () {

  const LITE = q.get('lite') === '1', QUAL = Math.min(1, +(q.get('q') || (LITE ? .5 : .8))), FPS = +(q.get('fps') || (LITE ? 30 : 60)), DPRM = LITE ? 1 : 1.5, RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const STILL = q.get('still') != null ? +(q.get('still') || 6) : (RM ? 6 : null);
  const cv = document.getElementById('c'), gl = cv.getContext('webgl', { preserveDrawingBuffer: STILL != null, antialias: false, powerPreference: LITE ? 'low-power' : 'default' });
  /* WebGL 이 없거나 꺼지면(오래된 PC · 그래픽 드라이버 문제) 멈춘 사진으로 대신 */
  const IMGS = (q.get('img') || '').split('|').filter(Boolean);
  const fallback = () => { document.body.style.background = `#05060A url("${new URL('../' + (IMGS[IMGS.length > 1 ? 1 : 0] || (MODE ? 'assets/fx-water.jpg' : 'assets/fx-fireground.jpg')), location.href).href}") center/cover no-repeat`; cv.style.display = 'none'; };

uniform sampler2D I; uniform vec2 R, IS; uniform float T, AM; uniform int M, LT; uniform vec4 LK0, LK1, LK2; uniform int LN; uniform float DM, LA; uniform vec4 SG[28]; uniform vec2 SD[28]; uniform vec4 ND[12]; uniform int NS, NN; uniform vec2 NR; uniform float SPD, PER, LW, FA; uniform int FX, LQ, EM, GR; uniform float FA2; uniform vec3 L1, L2; uniform vec2 NZ, TG;

float fireMask(vec3 c){return smoothstep(.5,.85,c.r)*smoothstep(.12,.4,c.r-c.b)*smoothstep(.95,.6,c.b+.0);}
float embers(vec2 u,float asp,float sp,float dens,vec4 box){float a=0.;
 for(int i=0;i<3;i++){float fi=float(i);vec2 g=vec2(u.x*asp,u.y)*(26.+fi*14.)+vec2(sin(u.y*9.+T*.8+fi*2.)*.7,T*sp*(1.+fi*.4));
  vec2 id=floor(g),f=fract(g)-.5;float r=h2(id+fi*7.3);if(r<dens){vec2 o=vec2(h2(id+3.)-.5,h2(id+5.)-.5)*.55;
   a+=smoothstep(.1+fi*.02,0.,length(f-o))*(.45+.55*sin(T*7.+r*50.));}}

vec4 flowNet(vec2 u,float ia){ // 경로를 따라 흐르는 전기 (뿌리 → 줄기 → 가지 → 화면) · 도착하면 화면이 켜짐

  vec2 P=(u-A)*vec2(ia,1.),AB=(B-A)*vec2(ia,1.);float L=max(length(AB),1e-4);vec2 ax=AB/L,nr=vec2(-ax.y,ax.x);
  float t=clamp(dot(P,ax)/L,0.,1.);if(length(P-ax*t*L)>.06*LW)continue; // 선에서 먼 화소는 건너뜀 (가벼움)

  vec2 q=(u-n.xy)/(NR*n.w);float m=smoothstep(1.,.35,length(q));G+=m*f;
  sig+=vec3(.4,.7,1.)*exp(-length(q)*3.5)*(since>0.?exp(-since*2.5):0.)*(LT==1?.25:.8);
  if(n.w<.7){float bt=.55+.45*pow(.5+.5*sin(T*5.),2.);sig+=vec3(.35,.7,1.)*(exp(-length(q)*2.2)*1.3*bt+exp(-length(q*vec2(.35,2.4))*2.)*.9*bt);} // AI 눈: 늘 맥박 · 가로로 번지는 빛
  float rr=since*.9;sig+=vec3(.35,.65,1.)*smoothstep(.06,0.,abs(length(q)-rr))*(since>0.&&rr<1.4?(1.-rr/1.4):0.)*(LT==1?0.:.5);}

 vec2 P=(u-A)*vec2(ia,1.),AB=(B-A)*vec2(ia,1.);float L=length(AB);vec2 ax=AB/L,nr=vec2(-ax.y,ax.x);

   vec2 dr=(u-pr)*vec2(sa,1.),db=(u-pb)*vec2(sa,1.);float lum=dot(c0,vec3(.3,.6,.1));

   c+=vec3(.15,.3,1.)*b*kk*(exp(-length(db)*4.)*(.22+lum*1.1)+.0016/(dot(db,db)+.0006));

   float road=smoothstep(.86,.95,u.y);c+=(vec3(1.,.1,.08)*r*exp(-abs(dr.x)*30.)+vec3(.2,.35,1.)*b*exp(-abs(db.x)*30.))*road*kk*.6*(.6+.4*vn(vec2(u.x*80.,u.y*200.+T*2.)));}

  vec2 A=NZ,B=TG;vec2 ab=(B-A)*vec2(sa,1.),ap=(u-A)*vec2(sa,1.);float s=clamp(dot(ap,ab)/dot(ab,ab),0.,1.);
  vec2 P=A+(B-A)*s-vec2(0.,.04*4.*s*(1.-s));float d=length((u-P)*vec2(sa,1.));float w=mix(.006,.03,s);
  float core=smoothstep(w,0.,d);float flow=fbm(vec2(s*22.-T*9.,d*80.));
  c+=vec3(.78,.9,1.)*core*smoothstep(.4,.8,flow)*.9;c+=vec3(.6,.75,.9)*smoothstep(w*3.,0.,d)*smoothstep(.55,.9,fbm(vec2(s*10.-T*6.,d*40.)))*.18;c=mix(c,c*.9+vec3(.08,.1,.12)*flow,core*.4);
  // 튀는 물방울

   vec2 p0=A+(B-A)*s0-vec2(0.,.04*4.*s0*(1.-s0));vec2 vel=vec2((h1(fi*5.)-.4)*.08,(h1(fi*7.)-.75)*.12);
   vec2 pp=p0+vel*age+vec2(0.,.35*age*age);vec2 dd=(u-pp)*vec2(sa,1.);
   c+=vec3(.85,.93,1.)*smoothstep(.0034,0.,length(dd))*(1.-age)*1.2;}

  float st=fbm((u-B)*vec2(5.,4.)+vec2(-T*.08,T*.22));float stm=smoothstep(.32,.0,length((u-B-vec2(-.08,-.02))*vec2(1.,1.3)));
  c=mix(c,vec3(.86,.84,.82)+vec3(.25,.1,.0)*glow*.3,smoothstep(.35,.85,st)*stm*.55);
  // 바닥 물보라 · 반짝임
  float gnd=smoothstep(.84,.95,u.y);float sp=pow(vn(vec2(u.x*300.,u.y*90.+T*6.)),12.);c+=vec3(1.,.8,.6)*sp*gnd*1.5;
  c+=vec3(.9,.95,1.)*embers(vec2(u.x,1.-u.y),sa,1.2,.05,vec4(.5,.02,.75,.12))*.8;

  float sw=fract(T/11.);float band=exp(-pow((u.x+u.y*.55-(sw*2.4-.4))*7.,2.));c+=(LT==1?vec3(1.):vec3(.55,.7,1.))*band*.07*AM; // 빛 훑기
  float dust=0.;for(int i=0;i<2;i++){float fi=float(i);vec2 g=vec2(u.x*sa,u.y)*(9.+fi*7.)+vec2(sin(u.y*4.+T*.3+fi)*.5,T*(.05+fi*.04));

   c+=vec3(.4,1.,.55)*embers(u,sa,-.12,.05,vec4(.45,.15,1.,.75))*.55;

  }

  const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(o)); return o; };

  const LKv = q.get('link') ? q.get('link').split(',').map(Number) : []; const LNn = Math.min(3, Math.floor(LKv.length / 4)); for (let k = 0; k < 3; k++) gl.uniform4f(U('LK' + k), ...(k < LNn ? LKv.slice(k * 4, k * 4 + 4) : [0, 0, 0, 0])); gl.uniform1i(U('LN'), LNn); gl.uniform1f(U('LA'), +(q.get('lamp') || 1)); gl.uniform1f(U('DM'), +(q.get('dim') || 1)); gl.uniform1i(U('M'), MODE); gl.uniform1i(U('LT'), LIGHT); gl.uniform1f(U('AM'), AMT); gl.uniform3f(U('L1'), ...L1); gl.uniform3f(U('L2'), ...L2); gl.uniform2f(U('NZ'), ...NOZ); gl.uniform2f(U('TG'), ...TGT);
  /* 흐름 경로: &net=x,y,x,y,…;x,y,… (첫 줄이 시작 · 다음 줄은 이미 있는 점에서 갈라짐 · 줄 앞에 ! 를 붙이면 그 줄도 처음부터 동시에 출발) &nodes=x,y,크기;… (도착하면 켜지는 화면)
     여러 장면: &img=바탕|장면1|장면2 &net=|경로1|경로2 &nodes=|…|… &at=1.2,3.2 (장면이 나오는 초) &cyc=8 — 발표 화면의 「프레임 순환」과 같은 박자로, WebGL 하나로 그림 */
  function parseNet(netStr, nodeStr) {
    const ia = 16 / 9, segs = [], dist = [], verts = [];
    const lines = (netStr || '').split(';').map(l => { const z = l.trim().startsWith('!'); const a = l.replace('!', '').split(',').map(Number); a.z = z; return a; }).filter(a => a.length >= 4 && a.every(isFinite));
    for (const a of lines) {
      const pts = []; for (let i = 0; i + 1 < a.length; i += 2) pts.push([a[i], a[i + 1]]);
      let d0 = 0; if (verts.length && !a.z) { let best = 1e9; for (const v of verts) { const e = Math.hypot((v[0] - pts[0][0]) * ia, v[1] - pts[0][1]); if (e < best) { best = e; d0 = v[2]; } } }
      verts.push([pts[0][0], pts[0][1], d0]);
      for (let i = 1; i < pts.length; i++) { const L = Math.hypot((pts[i][0] - pts[i - 1][0]) * ia, pts[i][1] - pts[i - 1][1]); segs.push([...pts[i - 1], ...pts[i]]); dist.push([d0, d0 + L]); d0 += L; verts.push([pts[i][0], pts[i][1], d0]); }
    }
    const nodes = (nodeStr || '').split(';').map(l => l.split(',').map(Number)).filter(a => a.length >= 2 && a.every(isFinite)).map(([x, y, k]) => {
      let best = 1e9, d = 0; for (const v of verts) { const e = Math.hypot((v[0] - x) * ia, v[1] - y); if (e < best) { best = e; d = v[2] + e; } } return [x, y, d, k || 1]; });
    if (segs.length > 28 || nodes.length > 12) console.warn('photo-fx: 경로는 28칸 · 화면은 12개까지만 그립니다');
    return { segs: segs.slice(0, 28), dist: dist.slice(0, 28), nodes: nodes.slice(0, 12) };
  }
  function useNet(n) {
    n.segs.forEach((g, i) => { gl.uniform4f(U('SG[' + i + ']'), ...g); gl.uniform2f(U('SD[' + i + ']'), ...n.dist[i]); });
    n.nodes.forEach((g, j) => gl.uniform4f(U('ND[' + j + ']'), ...g));
    gl.uniform1i(U('NS'), n.segs.length); gl.uniform1i(U('NN'), n.nodes.length);
  }
  const NETS = (q.get('net') || '').split('|'), NODES = (q.get('nodes') || '').split('|');
  const SRCS = IMGS.length ? IMGS : [MODE ? 'assets/fx-water.jpg' : 'assets/fx-fireground.jpg'];
  const AT = (q.get('at') || '').split(',').map(Number).filter(isFinite), CYC = +(q.get('cyc') || 8);
  const shots = SRCS.map((src, i) => ({ src: new URL('../' + src, location.href).href, net: parseNet(NETS[i], NODES[i]) }));
  gl.uniform2f(U('NR'), ...(q.get('nr') || '.055,.05').split(',').map(Number)); gl.uniform1f(U('SPD'), +(q.get('spd') || .5)); gl.uniform1f(U('LW'), +(q.get('lw') || 1)); gl.uniform1f(U('PER'), +(q.get('per') || 3.6));
  gl.uniform1i(U('FX'), q.get('fire') ? +(q.get('fire') === '1') : +(MODE < 2)); gl.uniform1i(U('LQ'), +LITE); gl.uniform1i(U('EM'), +(q.get('embers') === '1')); gl.uniform1i(U('GR'), +(q.get('green') === '1')); gl.uniform1f(U('FA2'), +(q.get('emb') || 1));
  /* 발표 화면 「프레임 순환」(8초 중 0~8% 나타남 · 25% 까지 · 33% 에 사라짐) 과 같은 불투명도 */
  const cycA = (t, at) => { if (t < at) return 0; const ph = ((t - at) % CYC) / CYC, sm = (x) => x * x * (3 - 2 * x); return ph < .08 ? sm(ph / .08) : ph < .25 ? 1 : ph < .33 ? 1 - sm((ph - .25) / .08) : 0; };
  function size() { const r = Math.min(DPRM, devicePixelRatio || 1); cv.width = Math.round(innerWidth * QUAL * r); cv.height = Math.round(innerHeight * QUAL * r); gl.viewport(0, 0, cv.width, cv.height); gl.uniform2f(U('R'), cv.width, cv.height); }
  addEventListener('resize', size); size();
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  const load = (u) => new Promise((res) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = u; });
  Promise.all(shots.map(s => load(s.src))).then((ims) => {
    shots.forEach((s, i) => { const im = ims[i]; if (!im) return; s.w = im.width; s.h = im.height;
      s.tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, s.tex); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, im);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); });
    if (!shots[0].tex) { fallback(); return; }
    const t0 = performance.now(); let last = -1e9;
    (function f(now) {
      if (lost) return;
      if (STILL == null) requestAnimationFrame(f);
      if (STILL == null && now - last < 1000 / FPS - 2) return; // 초당 그리는 횟수 제한 (가벼운 모드 30)
      last = now; const t = STILL != null ? STILL : Math.max(0, (now - t0) / 1000);
      gl.uniform1f(U('T'), t);
      shots.forEach((s, i) => {
        const a = i === 0 || shots.length === 1 ? 1 : cycA(t, AT[i - 1] != null ? AT[i - 1] : 0);
        if (a <= 0.003 || !s.tex) return;
        gl.bindTexture(gl.TEXTURE_2D, s.tex); gl.uniform2f(U('IS'), s.w, s.h); useNet(s.net); gl.uniform1f(U('FA'), a);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      });
    })(t0);
  });
  if (window.parent !== window) {
    const fwd = (key, ev) => { try { parent.document.dispatchEvent(new KeyboardEvent('keydown', { key, code: ev && ev.code, shiftKey: ev && ev.shiftKey, ctrlKey: ev && ev.ctrlKey, bubbles: true })); parent.focus(); } catch (e) { } };
    addEventListener('keydown', (ev) => { ev.preventDefault(); fwd(ev.key, ev); });
    addEventListener('click', () => fwd('ArrowRight'));
  }
})();
