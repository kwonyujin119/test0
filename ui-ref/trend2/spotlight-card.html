<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>스포트라이트 카드</title><link rel="stylesheet" href="../trend/base.css"><style>.g{display:grid;grid-template-columns:repeat(3,26vw);gap:2.4vw}
.c{position:relative;height:52vh;border-radius:22px;background:#121722;border:1px solid #232B3A;overflow:hidden;padding:4vh 2vw}
.c::before{content:"";position:absolute;inset:0;background:radial-gradient(28vw circle at var(--x) var(--y),rgba(255,120,60,.28),transparent 40%);opacity:var(--o,0);transition:opacity .4s}
.c h3{font-size:4.4vh;margin:0 0 2vh;position:relative}.c p{font-size:2.8vh;opacity:.75;position:relative;line-height:1.5}
.c b{font-size:9vh;color:#FF7A3D;position:relative;display:block;margin-top:5vh}</style></head><body><div class="g"><div class="c"><h3>소화</h3><p>초기 소화기 · 옥내소화전으로 불을 끈다</p><b>01</b></div><div class="c"><h3>통보</h3><p>119 신고 · 비상방송 · 경보</p><b>02</b></div><div class="c"><h3>피난</h3><p>재실자를 안전한 곳으로 유도</p><b>03</b></div></div><script>const cs=[...document.querySelectorAll('.c')];let t0=performance.now();
(function f(n){const t=(n-t0)/1000,i=Math.floor(t/2.4)%3,ph=(t%2.4)/2.4;cs.forEach((c,k)=>{const on=k===i;c.style.setProperty('--o',on?1:0);if(on){c.style.setProperty('--x',(20+60*ph)+'%');c.style.setProperty('--y',(30+40*Math.sin(ph*3.14))+'%')}});requestAnimationFrame(f)})(t0);</script></body></html>
