<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>넘김 시계</title><link rel="stylesheet" href="../trend/base.css"><style>.w{text-align:center}.cl{display:flex;gap:1.2vw;justify-content:center;align-items:center}
.f{position:relative;width:13vh;height:19vh;perspective:600px;font-size:14vh;font-weight:800;font-variant-numeric:tabular-nums}
.f div{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:#1A2130;display:flex;justify-content:center}
.f .t{top:0;border-radius:14px 14px 0 0;align-items:flex-end;border-bottom:1px solid #0B0F17}.f .t span{transform:translateY(50%)}
.f .b{bottom:0;border-radius:0 0 14px 14px;align-items:flex-start}.f .b span{transform:translateY(-50%)}
.f .ft{z-index:2;transform-origin:bottom;animation:ft .5s ease-in both}.f .fb{z-index:2;transform-origin:top;animation:fb .5s .5s ease-out both}
@keyframes ft{to{transform:rotateX(-90deg)}}@keyframes fb{from{transform:rotateX(90deg)}}
.col{font-size:12vh;opacity:.6}p{font-size:3.2vh;opacity:.8;margin-top:4vh}</style></head><body><div class="w"><div class="cl" id="cl"></div><p>휴식 시간 — 다음 시간 시작까지</p></div><script>const cl=document.getElementById('cl');const mk=()=>{const f=document.createElement('div');f.className='f';f.innerHTML='<div class="t"><span>0</span></div><div class="b"><span>0</span></div>';f.v='0';return f};
const fs=[mk(),mk(),null,mk(),mk()];fs.forEach(f=>{if(f)cl.appendChild(f);else{const c=document.createElement('span');c.className='col';c.textContent=':';cl.appendChild(c)}});
function set(f,v){if(f.v===v)return;const o=f.v;f.v=v;f.querySelector('.t span').textContent=v;f.querySelectorAll('.ft,.fb').forEach(e=>e.remove());const ft=document.createElement('div');ft.className='t ft';ft.innerHTML='<span>'+o+'</span>';const fb=document.createElement('div');fb.className='b fb';fb.innerHTML='<span>'+v+'</span>';f.append(ft,fb);setTimeout(()=>f.querySelector('.b span').textContent=v,1000)}
let sec=600;function tick(){const m=Math.floor(sec/60),s=sec%60,str=String(m).padStart(2,'0')+String(s).padStart(2,'0');[0,1,3,4].forEach((i,k)=>set(fs[i],str[k]));sec=sec>0?sec-1:600}tick();setInterval(tick,1000);</script></body></html>
