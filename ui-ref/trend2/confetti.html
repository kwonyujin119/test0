<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>축포</title><link rel="stylesheet" href="../trend/base.css"><style>canvas{position:fixed;inset:0;width:100%;height:100%}.w{text-align:center;position:relative}h1{font-size:10vh;margin:0}p{font-size:3.4vh;opacity:.8}</style></head><body><canvas id="c"></canvas><div class="w"><h1>정답!</h1><p>③ 경험의 원칙 — 실제 사례를 들어 현실감 있게</p></div><script>const c=document.getElementById('c'),x=c.getContext('2d');let W,H;function sz(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio}addEventListener('resize',sz);sz();
const C=['#FF6B35','#FFD23F','#2457D6','#0F7B6C','#FF5A4E','#fff'];let P=[];function boom(){for(let s of[-1,1])for(let i=0;i<110;i++){const a=(s<0?-Math.PI/3:-2*Math.PI/3)+(Math.random()-.5)*.9,v=(14+Math.random()*16)*devicePixelRatio;P.push({x:s<0?0:W,y:H*.85,vx:Math.cos(a)*v,vy:Math.sin(a)*v,c:C[i%C.length],r:Math.random()*6,w:6+Math.random()*8,h:4+Math.random()*6,s:Math.random()*.3-.15})}}
P.forEach=Array.prototype.forEach;boom();setInterval(boom,4000);
(function f(){x.clearRect(0,0,W,H);P=P.filter(p=>p.y<H+50);P.forEach(p=>{p.vy+=.45*devicePixelRatio;p.vx*=.985;p.vy*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.s;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w*devicePixelRatio/2,-p.h*devicePixelRatio/2,p.w*devicePixelRatio,p.h*devicePixelRatio);x.restore()});requestAnimationFrame(f)})();</script></body></html>
