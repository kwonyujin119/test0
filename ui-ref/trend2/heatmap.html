<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>히트맵</title><link rel="stylesheet" href="../trend/base.css"><style>.w{display:grid;grid-template-columns:7vw repeat(24,2.5vw);gap:.4vw;align-items:center}
.w span{font-size:2.2vh;opacity:.7;text-align:right;padding-right:.6vw}.w small{font-size:1.7vh;opacity:.55;text-align:center}
.w i{height:6.2vh;border-radius:6px;background:#1A2130;transition:background .6s}
h3{font-size:4vh;margin:0 0 3vh}p{font-size:2.4vh;opacity:.6;margin-top:3vh}</style></head><body><div><h3>요일 · 시간대별 화재 출동 (가상 예시)</h3><div class="w" id="w"></div><p>진할수록 출동이 많음 — 퇴근 시간 · 주말 저녁에 몰린다</p></div><script>const w=document.getElementById('w');const D=['월','화','수','목','금','토','일'];w.appendChild(document.createElement('span'));for(let h=0;h<24;h++){const s=document.createElement('small');s.textContent=h%3?'':h;w.appendChild(s)}
const cells=[];D.forEach((d,di)=>{const s=document.createElement('span');s.textContent=d;w.appendChild(s);for(let h=0;h<24;h++){const i=document.createElement('i');w.appendChild(i);const v=Math.max(0,Math.min(1,.25+.55*Math.exp(-Math.pow((h-18.5)/3,2))+.3*Math.exp(-Math.pow((h-12)/2.5,2))+(di>=4?.18*Math.exp(-Math.pow((h-21)/3,2)):0)+(Math.random()-.5)*.15));cells.push([i,v])}});
const col=v=>{const a=[[26,33,48],[120,60,40],[255,107,53],[255,220,120]];const t=v*3,k=Math.min(2,Math.floor(t)),f=t-k;return`rgb(${a[k].map((c,j)=>Math.round(c+(a[k+1][j]-c)*f)).join(',')})`};
function run(){cells.forEach(([i])=>i.style.background='#1A2130');cells.forEach(([i,v],k)=>setTimeout(()=>i.style.background=col(v),(k%24)*45+Math.floor(k/24)*25))}run();setInterval(run,6000);</script></body></html>
