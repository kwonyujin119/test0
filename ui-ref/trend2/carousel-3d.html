<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D 회전 캐러셀</title><link rel="stylesheet" href="../trend/base.css"><style>.s{perspective:1800px;width:100vw;height:70vh;display:grid;place-items:center}
.r{position:relative;width:24vw;height:44vh;transform-style:preserve-3d;animation:rot 24s linear infinite}@keyframes rot{to{transform:rotateY(-360deg)}}
.c{position:absolute;inset:0;border-radius:18px;display:flex;flex-direction:column;justify-content:flex-end;padding:3vh 1.4vw;backface-visibility:hidden;border:1px solid #ffffff22}
.c h3{font-size:3.6vh;margin:0}.c p{font-size:2.2vh;margin:.6vh 0 0;opacity:.85}</style></head><body><div class="s"><div class="r" id="r"></div></div><script>const D=[['청라','지하주차장 · 2024','#5B2A1E'],['제천','스포츠센터 · 2017','#3A2A1E'],['밀양','병원 · 2018','#2A2A33'],['화성','리튬전지 · 2024','#4A2210'],['왕길동','공장 · 2024','#1E2A3A'],['원창동','공장단지 · 2026','#3A1A10'],['대전','부품 공장 · 2026','#2A1E1E'],['이천','물류센터 · 2021','#1E2E2A']];
const r=document.getElementById('r'),n=D.length,R=Math.round(24/2/Math.tan(Math.PI/n)*1.15);D.forEach(([a,b,col],i)=>{const c=document.createElement('div');c.className='c';c.style.background=`linear-gradient(180deg,${col} 10%,#0B0F17)`;c.style.transform=`rotateY(${i*360/n}deg) translateZ(${R}vw)`;c.innerHTML=`<h3>${a}</h3><p>${b}</p>`;r.appendChild(c)});</script></body></html>
