<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>카드 넘기기 (스택)</title><link rel="stylesheet" href="../trend/base.css"><style>.w{position:relative;width:48vw;height:58vh;perspective:1400px}
.c{position:absolute;inset:0;border-radius:24px;padding:5vh 3vw;display:flex;flex-direction:column;justify-content:flex-end;transition:transform .8s cubic-bezier(.3,.7,.2,1),opacity .8s;box-shadow:0 3vh 8vh #0008}
.c h3{font-size:6vh;margin:0 0 1.4vh}.c p{font-size:3vh;margin:0;opacity:.85}.c small{position:absolute;top:4vh;left:3vw;font-size:2.4vh;opacity:.7}</style></head><body><div class="w" id="w"></div><script>const D=[['1단계','상황 판단','건물 구조 · 연소 범위 · 요구조자','#B3261E'],['2단계','지휘 선언','현장지휘관 1명 · 무전 채널 1개','#2457D6'],['3단계','안전 확보','경계 구역 · 2인 1조 · 퇴로','#0F7B6C'],['4단계','전술 결정','공격 · 방어 · 혼합','#9A5B00']];
const w=document.getElementById('w');const cs=D.map(([a,b,c,col])=>{const e=document.createElement('div');e.className='c';e.style.background=`linear-gradient(160deg,${col},#151B27)`;e.innerHTML=`<small>${a}</small><h3>${b}</h3><p>${c}</p>`;w.appendChild(e);return e});
let tp=0;function lay(){cs.forEach((c,i)=>{const k=(i-tp+cs.length)%cs.length;c.style.zIndex=10-k;c.style.transform=`translate(${k*2.2}vw,${-k*3}vh) scale(${1-k*.06}) rotateY(${-k*4}deg)`;c.style.opacity=k>2?0:1})}
lay();setInterval(()=>{const c=cs[tp];c.style.transform='translate(-60vw,4vh) rotate(-14deg)';c.style.opacity=0;setTimeout(()=>{tp=(tp+1)%cs.length;lay()},500)},2600);</script></body></html>
