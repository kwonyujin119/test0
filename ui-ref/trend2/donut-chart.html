<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>도넛 차트</title><link rel="stylesheet" href="../trend/base.css"><style>.w{display:flex;align-items:center;gap:5vw}svg{width:56vh;height:56vh;transform:rotate(-90deg)}circle{fill:none;stroke-width:16;transition:stroke-dasharray 1.2s cubic-bezier(.3,.7,.2,1),stroke-dashoffset 1.2s cubic-bezier(.3,.7,.2,1)}
.ctr{position:absolute;text-align:center}.ctr b{font-size:8vh;display:block}.ctr span{font-size:2.6vh;opacity:.7}.box{position:relative;display:grid;place-items:center}
.lg div{display:flex;align-items:center;gap:1vw;font-size:3vh;margin:2vh 0;opacity:0;transform:translateX(2vw);transition:.5s}.lg div.on{opacity:1;transform:none}.lg i{width:2.4vh;height:2.4vh;border-radius:6px}.lg em{font-style:normal;margin-left:auto;padding-left:2vw;font-weight:700}</style></head><body><div class="w"><div class="box"><svg viewBox="0 0 120 120" id="s"></svg><div class="ctr"><b>100%</b><span>화재 원인 (가상 예시)</span></div></div><div class="lg" id="lg"></div></div><script>const D=[['부주의',48,'#FF6B35'],['전기적 요인',24,'#2457D6'],['기계적 요인',11,'#0F7B6C'],['방화 · 기타',17,'#7A7F86']],s=document.getElementById('s'),lg=document.getElementById('lg');const C=2*Math.PI*48;
const cs=D.map(([n,v,col])=>{const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',60);c.setAttribute('cy',60);c.setAttribute('r',48);c.setAttribute('stroke',col);c.style.strokeDasharray=`0 ${C}`;s.appendChild(c);const l=document.createElement('div');l.innerHTML=`<i style="background:${col}"></i>${n}<em>${v}%</em>`;lg.appendChild(l);return[c,l,v]});
function run(){let acc=0;cs.forEach(([c,l])=>{c.style.strokeDasharray=`0 ${C}`;l.classList.remove('on')});setTimeout(()=>cs.forEach(([c,l,v],i)=>setTimeout(()=>{c.style.strokeDasharray=`${C*v/100-1} ${C}`;c.style.strokeDashoffset=-C*acc/100;acc+=v;l.classList.add('on')},i*500)),300)}run();setInterval(run,6000);</script></body></html>
