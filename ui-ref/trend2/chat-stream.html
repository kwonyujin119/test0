<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>채팅 스트림</title><link rel="stylesheet" href="../trend/base.css"><style>.w{width:56vw;height:80vh;display:flex;flex-direction:column;justify-content:flex-end;gap:2vh}
.m{max-width:70%;padding:2vh 1.6vw;border-radius:22px;font-size:2.9vh;line-height:1.5;animation:in .45s cubic-bezier(.2,.8,.2,1) both}
.u{align-self:flex-end;background:#2457D6;border-bottom-right-radius:6px}.a{align-self:flex-start;background:#1A2130;border:1px solid #2A3346;border-bottom-left-radius:6px}
@keyframes in{from{opacity:0;transform:translateY(3vh) scale(.96)}}
.dots{display:inline-flex;gap:.5vw}.dots i{width:1.2vh;height:1.2vh;border-radius:50%;background:#8B949E;animation:d 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes d{50%{transform:translateY(-.8vh);opacity:.4}}</style></head><body><div class="w" id="w"></div><script>const S=[['u','3장 제목을 「현장지휘」로 바꿔 줘'],['a','바꿨습니다. 3장 제목 = 「현장지휘」. 화면에서 확인해 주세요.'],['u','글자를 조금 더 크게'],['a','제목 글자를 60 → 72로 키웠습니다.']];
const w=document.getElementById('w');async function run(){w.innerHTML='';for(const [r,t] of S){const m=document.createElement('div');m.className='m '+r;if(r==='a'){m.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';w.appendChild(m);await new Promise(z=>setTimeout(z,1200));m.textContent='';for(const ch of t){m.textContent+=ch;await new Promise(z=>setTimeout(z,28))}}else{m.textContent=t;w.appendChild(m)}await new Promise(z=>setTimeout(z,900))}setTimeout(run,2500)}run();</script></body></html>
