<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>단계 진행 표시</title><link rel="stylesheet" href="../trend/base.css"><style>.w{width:80vw}.s{display:flex;align-items:flex-start}
.st{flex:none;text-align:center;width:12vw}.st .d{width:9vh;height:9vh;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:3.6vh;font-weight:800;background:#1A2130;border:3px solid #2A3346;transition:.5s}
.st p{font-size:2.6vh;margin:1.6vh 0 0;opacity:.5;transition:.5s}
.st.on .d{background:#FF6B35;border-color:#FF6B35;box-shadow:0 0 4vh #FF6B3588}.st.on p{opacity:1}.st.done .d{background:#0F7B6C;border-color:#0F7B6C}.st.done p{opacity:.85}
.bar{flex:1;height:.6vh;margin-top:4.2vh;background:#2A3346;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#0F7B6C;transition:width .6s}
.desc{margin-top:7vh;text-align:center;font-size:4.2vh;min-height:6vh}</style></head><body><div class="w"><div class="s" id="s"></div><div class="desc" id="d"></div></div><script>const D=[['사전기획','계획의 범위 · 일정 · 담당 정하기'],['위험환경 분석','시설 · 사람 · 위험물 파악'],['설계 · 개발','자위소방대 · 피난계획 작성'],['시행 · 유지관리','훈련하고 매년 고쳐 쓰기']];
const s=document.getElementById('s'),d=document.getElementById('d');const sts=[],bars=[];D.forEach(([n],i)=>{if(i){const b=document.createElement('div');b.className='bar';b.innerHTML='<i></i>';s.appendChild(b);bars.push(b.firstChild)}const e=document.createElement('div');e.className='st';e.innerHTML=`<div class="d">${i+1}</div><p>${n}</p>`;s.appendChild(e);sts.push(e)});
let k=0;function go(){sts.forEach((e,i)=>{e.className='st'+(i<k?' done':i===k?' on':'')});bars.forEach((b,i)=>b.style.width=i<k?'100%':'0');d.textContent=k<D.length?D[k][1]:'✓ 소방계획 완성';k=(k+1)%(D.length+1)}go();setInterval(go,1700);</script></body></html>
