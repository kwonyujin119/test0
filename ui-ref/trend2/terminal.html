<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>터미널</title><link rel="stylesheet" href="../trend/base.css"><style>.t{width:66vw;height:68vh;border-radius:16px;background:#0D1117;border:1px solid #2A3346;overflow:hidden;font-family:ui-monospace,Consolas,monospace}
