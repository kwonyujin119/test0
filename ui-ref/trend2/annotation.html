<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>주석 콜아웃</title><link rel="stylesheet" href="../trend/base.css"><style>.w{position:relative;width:70vw;height:76vh;border-radius:22px;overflow:hidden;background:linear-gradient(160deg,#2A2F38,#14161B)}
.bld{position:absolute;left:28%;bottom:0;width:30%;height:78%;background:#3A404B;border-radius:6px 6px 0 0;background-image:linear-gradient(#ffffff10 1px,transparent 1px),linear-gradient(90deg,#ffffff10 1px,transparent 1px);background-size:2.4vw 7vh}
.dot{position:absolute;width:2vh;height:2vh;margin:-1vh;border-radius:50%;background:#FFD23F;box-shadow:0 0 2vh #FFD23F;transform:scale(0);transition:transform .35s}
svg{position:absolute;inset:0;width:100%;height:100%}svg line{stroke:#FFD23F;stroke-width:2;stroke-dasharray:400;stroke-dashoffset:400;transition:stroke-dashoffset .6s ease}
.lab{position:absolute;padding:1.2vh 1.2vw;border-radius:12px;background:#0B0F17ee;border:1px solid #FFD23F;font-size:2.4vh;opacity:0;transform:translateY(1vh);transition:.4s;max-width:20vw}.lab b{color:#FFD23F;display:block;font-size:2.6vh}
.on .dot{transform:scale(1)}.on line{stroke-dashoffset:0}.on .lab{opacity:1;transform:none}</style></head><body><div class="w" id="w"><div class="bld"></div><svg id="s"></svg></div><script>const w=document.getElementById('w'),s=document.getElementById('s');const A=[[.5,.3,.78,.12,'① 연소 확대 경로','계단실 방화문 철거'],[.35,.62,.04,.5,'② 정지 버튼','스프링클러 수동 정지'],[.55,.85,.74,.72,'③ 피난 지연','거동불편 환자 99명']];
const gs=A.map(([x,y,lx,ly,t,d])=>{const g=document.createElement('div');const dot=document.createElement('div');dot.className='dot';dot.style.left=x*100+'%';dot.style.top=y*100+'%';const lab=document.createElement('div');lab.className='lab';lab.style.left=lx*100+'%';lab.style.top=ly*100+'%';lab.innerHTML=`<b>${t}</b>${d}`;
const l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',x*100+'%');l.setAttribute('y1',y*100+'%');l.setAttribute('x2',(lx+.08)*100+'%');l.setAttribute('y2',(ly+.06)*100+'%');s.appendChild(l);w.append(dot,lab);return[dot,lab,l]});
let k=0;setInterval(()=>{if(k<gs.length)gs[k].forEach(e=>e.parentElement===w||e.parentNode===s?0:0),gs[k][0].style.transform='scale(1)',gs[k][2].style.strokeDashoffset=0,setTimeout((g=>()=>{g[1].style.opacity=1;g[1].style.transform='none'})(gs[k]),400);else if(k>gs.length+2){gs.forEach(g=>{g[0].style.transform='';g[2].style.strokeDashoffset=400;g[1].style.opacity=0;g[1].style.transform=''});k=-1}k++},1200);</script></body></html>
