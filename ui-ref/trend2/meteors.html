<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>유성 배경</title><link rel="stylesheet" href="../trend/base.css"><style>body{background:radial-gradient(ellipse at 50% 120%,#1B2333,#07090E)}
.m{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px #ffffff20;transform:rotate(215deg);animation:m linear infinite}
.m::before{content:"";position:absolute;top:50%;transform:translateY(-50%);width:18vw;height:1px;background:linear-gradient(90deg,#FFB27A,transparent)}
@keyframes m{0%{transform:rotate(215deg) translateX(0);opacity:1}70%{opacity:1}100%{transform:rotate(215deg) translateX(-140vw);opacity:0}}
h1{font-size:9vh;margin:0;text-align:center;position:relative}p{font-size:3.2vh;opacity:.75;text-align:center;position:relative}</style></head><body><div><h1>오늘의 목표</h1><p>현장지휘관의 첫 5분을 설계한다</p></div><script>for(let i=0;i<26;i++){const m=document.createElement('span');m.className='m';m.style.top=(Math.random()*60-10)+'%';m.style.left=(Math.random()*110)+'%';m.style.animationDelay=(Math.random()*8)+'s';m.style.animationDuration=(3+Math.random()*6)+'s';document.body.appendChild(m)}</script></body></html>
