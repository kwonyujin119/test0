<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>부채꼴 카드</title><link rel="stylesheet" href="../trend/base.css"><style>.w{position:relative;width:80vw;height:76vh}
.c{position:absolute;left:50%;bottom:4vh;width:17vw;height:46vh;margin-left:-8.5vw;border-radius:20px;padding:3vh 1.4vw;transform-origin:50% 120%;transition:transform 1s cubic-bezier(.3,.7,.2,1);box-shadow:0 2vh 5vh #0009;display:flex;flex-direction:column}
.c b{font-size:7vh}.c h3{font-size:3.6vh;margin:auto 0 1vh}.c p{font-size:2.3vh;opacity:.85;margin:0}
h2{position:absolute;top:0;width:100%;text-align:center;font-size:4.4vh;margin:0}</style></head><body><div class="w" id="w"><h2>소화기 종류 — 화재에 맞게 고르기</h2></div><script>const D=[['A','일반 화재','목재 · 종이 · 섬유','#9A5B00'],['B','유류 화재','휘발유 · 식용유','#B3261E'],['C','전기 화재','배전반 · 전선','#2457D6'],['K','주방 화재','식용유 대형 화재','#7A4BC2'],['D','금속 화재','마그네슘 · 리튬','#5B6168']];
const w=document.getElementById('w');const cs=D.map(([a,b,c,col])=>{const e=document.createElement('div');e.className='c';e.style.background=`linear-gradient(170deg,${col},#151B27 85%)`;e.innerHTML=`<b>${a}</b><h3>${b}</h3><p>${c}</p>`;w.appendChild(e);return e});
let open=false;function lay(){cs.forEach((c,i)=>{const k=i-(cs.length-1)/2;c.style.transform=open?`rotate(${k*14}deg) translateY(${Math.abs(k)*2}vh)`:`rotate(${k*1.5}deg)`})}lay();setInterval(()=>{open=!open;lay()},2600);setTimeout(()=>{open=true;lay()},500);</script></body></html>
