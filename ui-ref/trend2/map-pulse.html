<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>지도 맥박 핀</title><link rel="stylesheet" href="../trend/base.css"><style>.m{position:relative;width:74vw;height:78vh;border-radius:22px;overflow:hidden;background:#0E141F;background-image:linear-gradient(#1A2333 1px,transparent 1px),linear-gradient(90deg,#1A2333 1px,transparent 1px);background-size:4vw 4vw}
.rd{position:absolute;background:#1F2A3D}.pin{position:absolute;width:2.2vh;height:2.2vh;margin:-1.1vh;border-radius:50%;background:#FF5A4E;box-shadow:0 0 2vh #FF5A4E;transform:scale(0);transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.pin.on{transform:scale(1)}.pin::after{content:"";position:absolute;inset:-1.1vh;border-radius:50%;border:2px solid #FF5A4E;animation:pp 1.6s ease-out infinite}@keyframes pp{to{transform:scale(3);opacity:0}}
.pin span{position:absolute;left:3vh;top:-1vh;white-space:nowrap;font-size:2.2vh;background:#000a;padding:.3vh .8vw;border-radius:8px}
.st{position:absolute;width:2.6vh;height:2.6vh;margin:-1.3vh;border-radius:6px;background:#2457D6;display:grid;place-items:center;font-size:1.6vh}</style></head><body><div class="m" id="m"><div class="rd" style="left:0;right:0;top:46%;height:2.4vh"></div><div class="rd" style="top:0;bottom:0;left:38%;width:2.4vw"></div><div class="rd" style="top:0;bottom:0;left:72%;width:1.6vw"></div></div><script>const m=document.getElementById('m');[[.2,.3],[.82,.7]].forEach(([x,y])=>{const s=document.createElement('div');s.className='st';s.style.left=x*100+'%';s.style.top=y*100+'%';s.textContent='119';m.appendChild(s)});
const P=[[.45,.22,'14:02 공장 화재'],[.6,.62,'14:10 차량 화재'],[.3,.75,'14:21 주택 화재'],[.78,.32,'14:35 구조 요청'],[.52,.48,'14:41 가스 누출']];
const ps=P.map(([x,y,n])=>{const p=document.createElement('div');p.className='pin';p.style.left=x*100+'%';p.style.top=y*100+'%';p.innerHTML='<span>'+n+'</span>';m.appendChild(p);return p});
let k=0;setInterval(()=>{if(k<ps.length)ps[k].classList.add('on');else if(k>ps.length+2){ps.forEach(p=>p.classList.remove('on'));k=-1}k++},900);</script></body></html>
