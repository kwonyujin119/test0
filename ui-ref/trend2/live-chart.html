canvas{width:76vw;height:46vh;display:block}p{font-size:2.4vh;opacity:.6}</style></head><body><div class="w"><h3>방수 압력 (가상 예시)</h3><div class="v"><span id="v">0.35</span><small>MPa</small></div><canvas id="c"></canvas><p>옥내소화전 기준 0.17 MPa 이상 — 점선</p></div><script>const c=document.getElementById('c'),x=c.getContext('2d'),v=document.getElementById('v');let W,H;function sz(){W=c.width=c.clientWidth*devicePixelRatio;H=c.height=c.clientHeight*devicePixelRatio}addEventListener('resize',sz);sz();

x.clearRect(0,0,W,H);const Y=q=>H-(q/.6)*H;x.setLineDash([8,8]);x.strokeStyle='#FF5A4E88';x.lineWidth=2;x.beginPath();x.moveTo(0,Y(.17));x.lineTo(W,Y(.17));x.stroke();x.setLineDash([]);
const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#6EE7A055');g.addColorStop(1,'#6EE7A000');x.beginPath();pts.forEach((p,i)=>{const X=i/239*W;i?x.lineTo(X,Y(p)):x.moveTo(X,Y(p))});x.lineWidth=4;x.strokeStyle='#6EE7A0';x.stroke();x.lineTo((pts.length-1)/239*W,H);x.lineTo(0,H);x.fillStyle=g;x.fill();
const lx=(pts.length-1)/239*W,ly=Y(pts[pts.length-1]);x.beginPath();x.arc(lx,ly,8,0,7);x.fillStyle='#fff';x.fill();requestAnimationFrame(f)})();</script></body></html>
