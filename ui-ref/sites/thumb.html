<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>효과 개념도</title>
<style>html,body{margin:0;height:100%;background:#070A10;overflow:hidden}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas>
<script>
/* 2번 교안: 레퍼런스 사이트의 효과를 「개념도」로 그림 (실제 화면 캡처 아님). ?k=종류&h=색상(0~360)&s=씨앗&t=시간 */
const q=new URLSearchParams(location.search),K=q.get('k')||'particles',HU=+(q.get('h')||210),SD=+(q.get('s')||1);
const LIVE=q.get('live')==='1',DPR=2;const cv=document.getElementById('c'),g=cv.getContext('2d');const W=cv.width=innerWidth*DPR,H=cv.height=innerHeight*DPR;
let sd=1;const R=()=>((sd=(sd*16807)%2147483647)/2147483647);let t=+(q.get('t')||0);const S=Math.min(W,H)/450;
const hs=(h,s,l,a=1)=>`hsla(${(h+360)%360},${s}%,${l}%,${a})`;
const glow=(x,y,r,col)=>{const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,2*r,2*r)};
const cx=W/2,cy=H/2,M=Math.min(W,H);
const D={
particles(){g.globalCompositeOperation='lighter';for(let i=0;i<500;i++){const x=(R()*W+Math.sin(t*.6+i)*30+t*20*(R()-.5))%W,y=(R()*H-t*25*(.3+R())+H*10)%H,r=R()*3+1;glow(x,y,r*4,hs(HU+R()*40,90,65,.3+.3*Math.sin(t*3+i)**2))}},
waves(){g.globalCompositeOperation='lighter';for(let j=0;j<36;j++)for(let i=0;i<60;i++){const z=j/36,x=cx+(i-30)*W/52*(.3+z),y=H*.35+z*H*.6+Math.sin(i*.35+j*.4+t*1.8)*30*(.3+z);glow(x,y,6*(.3+z),hs(HU+z*40,90,65,.6))}},
beams(){g.globalCompositeOperation='lighter';for(let i=0;i<14;i++){const sx=R()*W,sy=H*(.1+R()*.8),L=sx<cx;g.strokeStyle=hs(HU+i*6,90,60,.25);g.lineWidth=2;g.beginPath();g.moveTo(L?0:W,sy);g.bezierCurveTo(cx*(L?.5:1.5),sy,cx,cy,cx,cy);g.stroke();
 const u=((t*.5+R())%1);const bx=(a,b,c,d,k)=>(1-k)**3*a+3*(1-k)**2*k*b+3*(1-k)*k*k*c+k**3*d;glow(bx(L?0:W,cx*(L?.5:1.5),cx,cx,u),bx(sy,sy,cy,cy,u),18,hs(HU+i*6,90,70,.9))}glow(cx,cy,M*(.1+.03*Math.sin(t*3)),hs(HU,90,75,.9))},
globe(){const r=M*.36,rot=t*.5;g.strokeStyle=hs(HU,70,55,.35);g.lineWidth=2;for(let i=-6;i<=6;i++){const a=i/14*Math.PI+rot%(Math.PI/7);g.beginPath();g.ellipse(cx,cy,Math.abs(r*Math.cos(a)),r,0,0,7);g.stroke();g.beginPath();g.ellipse(cx,cy+i*r/7,r*Math.sqrt(1-Math.pow(i/7,2)),r*.12,0,0,7);g.stroke()}
 g.globalCompositeOperation='lighter';for(let i=0;i<400;i++){const a=R()*6.28+rot,b=Math.acos(2*R()-1);if(Math.sin(a)*Math.sin(b)<0)continue;glow(cx+r*Math.cos(a)*Math.sin(b),cy+r*Math.cos(b),5,hs(HU+30,90,70,.8))}
 for(let i=0;i<4;i++){const k=(t*.6+i/4)%1;g.strokeStyle=hs(HU+120,90,65,1-k);g.lineWidth=3;const a=cx-r*.6+R()*r*1.2,b=cy-r*.5+R()*r,e=cx-r*.5+R()*r,f=cy-r*.5+R()*r;g.beginPath();g.moveTo(a,b);g.quadraticCurveTo(cx,cy-r*1.1,a+(e-a)*k,b+(f-b)*k);g.stroke()}},
retrogrid(){g.strokeStyle=hs(HU,90,60,.7);g.lineWidth=2.5;const hy=H*.48;for(let i=-20;i<=20;i++){g.beginPath();g.moveTo(cx+i*40,hy);g.lineTo(cx+i*260,H);g.stroke()}for(let j=0;j<14;j++){const k=((j+t*1.2)%14)/14,y=hy+(H-hy)*k*k;g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}glow(cx,hy,M*.4,hs(HU+40,90,60,.5))},
card3d(){const a=Math.sin(t*1.2)*.18,b=Math.cos(t*.9)*.1;g.save();g.translate(cx,cy);g.transform(1,a*.6,b+.1,1,0,0);g.shadowColor='#000';g.shadowBlur=80;g.shadowOffsetY=50;const w=M*.9,h=M*.6;const gr=g.createLinearGradient(-w/2,-h/2,w/2,h/2);gr.addColorStop(0,hs(HU,70,45));gr.addColorStop(1,hs(HU+60,70,20));g.fillStyle=gr;g.beginPath();g.roundRect(-w/2,-h/2,w,h,40);g.fill();g.shadowBlur=0;
 g.fillStyle='rgba(255,255,255,.14)';g.beginPath();g.roundRect(-w/2+50+a*60,-h/2+50+b*60,w*.45,h*.4,20);g.fill();g.fillStyle='rgba(255,255,255,.6)';g.fillRect(-w/2+50,h/2-120,w*.5,18);g.fillRect(-w/2+50,h/2-80,w*.3,14);
 const sh=g.createLinearGradient(-w/2+((t*.4)%1.6-.3)*w,0,-w/2+((t*.4)%1.6-.1)*w,0);sh.addColorStop(0,'rgba(255,255,255,0)');sh.addColorStop(.5,'rgba(255,255,255,.18)');sh.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=sh;g.beginPath();g.roundRect(-w/2,-h/2,w,h,40);g.fill();g.restore()},
spotlight(){g.globalCompositeOperation='lighter';const sw=Math.sin(t*.8)*W*.15,x0=cx+sw*.3;const gr=g.createLinearGradient(x0,0,x0,H);gr.addColorStop(0,hs(HU,80,75,.55));gr.addColorStop(1,hs(HU,80,50,0));g.fillStyle=gr;g.beginPath();g.moveTo(x0-40,0);g.lineTo(x0+40,0);g.lineTo(x0+W*.3+sw,H);g.lineTo(x0-W*.25+sw,H);g.fill();glow(x0,0,M*.3,hs(HU,90,80,.6))},
textfx(){g.font=`900 ${M*.5}px system-ui`;g.textAlign='center';g.textBaseline='middle';const o=((t*.35)%1.6-.3)*M*1.4;const gr=g.createLinearGradient(cx-M*.7+o,0,cx-M*.2+o,0);gr.addColorStop(0,hs(HU,90,60));gr.addColorStop(.5,'#fff');gr.addColorStop(1,hs(HU+80,90,60));g.fillStyle=gr;g.shadowColor=hs(HU,90,60);g.shadowBlur=60;g.save();g.translate(cx,cy);g.rotate(Math.sin(t)*.06);g.scale(1+.04*Math.sin(t*1.7),1);g.fillText('Aa',0,0);g.restore()},
blobs(){const k=8,oc=D._oc||(D._oc=document.createElement('canvas'));oc.width=Math.ceil(W/k);oc.height=Math.ceil(H/k);const o=oc.getContext('2d');o.filter='blur(7px)';
 for(let i=0;i<6;i++){o.fillStyle=hs(HU+i*35+t*20,80,55,.8);const bx=R()*W,by=R()*H,a=R()*6;o.beginPath();o.ellipse((bx+Math.sin(t*.7+i)*W*.12)/k,(by+Math.cos(t*.6+i*2)*H*.15)/k,M*(.25+R()*.3)/k,M*(.15+R()*.2)/k,a+t*.3,0,7);o.fill()}
 g.imageSmoothingQuality='high';g.drawImage(oc,0,0,W,H)},
tunnel(){g.globalCompositeOperation='lighter';for(let i=0;i<220;i++){const a=R()*6.28,ph=(R()+t*.7*(.5+R()))%1,r1=M*(.02+ph*ph*1.2),r2=r1+M*(.05+ph*.5);g.strokeStyle=hs(HU+(R()<.5?0:150),95,60,.25+ph*.6);g.lineWidth=1+ph*6;g.beginPath();g.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1*.6);g.lineTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2*.6);g.stroke()}},
ripple(){for(let i=0;i<9;i++){const k=((i+t*1.5)%9)/9;g.strokeStyle=hs(HU,80,60,1-k);g.lineWidth=4;g.beginPath();g.arc(cx,cy,k*M*.55,0,7);g.stroke()}glow(cx,cy,M*.1,hs(HU,90,70))},
orbit(){for(let i=1;i<4;i++){g.strokeStyle=hs(HU,50,50,.4);g.setLineDash([12,14]);g.lineWidth=2;g.beginPath();g.arc(cx,cy,i*M*.13,0,7);g.stroke();g.setLineDash([]);for(let k=0;k<i+2;k++){const a=R()*6.28+t*(i%2?.6:-.4)/i;g.fillStyle=hs(HU+k*30,70,60);g.beginPath();g.arc(cx+Math.cos(a)*i*M*.13,cy+Math.sin(a)*i*M*.13,22,0,7);g.fill()}}glow(cx,cy,M*.08,hs(HU,90,70))},
terrain(){g.strokeStyle=hs(HU,90,60,.8);g.lineWidth=2;for(let j=0;j<30;j++){g.beginPath();const jj=j+t*3;for(let i=0;i<=80;i++){const z=j/30,x=i/80*W,y=H*.35+z*H*.65-(Math.sin(i*.2+jj*.3)+Math.sin(i*.07-jj*.2)*1.6+1.5)*60*(1-z*.4);i?g.lineTo(x,y):g.moveTo(x,y)}g.stroke()}},
noise(){const s=14;for(let y=0;y<H;y+=s)for(let x=0;x<W;x+=s){const v=(Math.sin(x*.004+y*.006+t)+Math.sin(x*.009-y*.003-t*1.3)+2)/4;if(R()<v){g.fillStyle=hs(HU,60,20+v*60);g.fillRect(x+(Math.random()<.01?20:0),y,s-2,s-2)}}},
gallery(){for(let i=0;i<11;i++){let a=((i/11+t*.06)%1-.5)*3.2;const x=cx+Math.sin(a)*W*.42,y=cy+(1-Math.cos(a))*H*.25,s=Math.max(.2,1-Math.abs(a)*.25);g.save();g.translate(x,y);g.rotate(a*.3);g.fillStyle=hs(HU+i*25,60,45);g.beginPath();g.roundRect(-110*s,-150*s,220*s,300*s,18);g.fill();g.restore()}},
trail(){for(let i=0;i<14;i++){const tt=t*.8-i*.12,x=cx+Math.sin(tt*1.3)*W*.38,y=cy+Math.sin(tt*2.1)*H*.3;g.globalAlpha=(1-i/14);g.fillStyle=hs(HU+i*12,60,50);g.beginPath();g.roundRect(x-80,y-105,160,210,14);g.fill()}g.globalAlpha=1},
glass(){D.blobs();g.fillStyle='rgba(255,255,255,.1)';g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=3;g.beginPath();g.roundRect(cx-M*.45,cy-M*.3,M*.9,M*.6,40);g.fill();g.stroke();
 const k=(t*.5)%1,P=2*(M*.9+M*.6),d=k*P;let x,y;const w=M*.9,h=M*.6;if(d<w){x=cx-w/2+d;y=cy-h/2}else if(d<w+h){x=cx+w/2;y=cy-h/2+(d-w)}else if(d<2*w+h){x=cx+w/2-(d-w-h);y=cy+h/2}else{x=cx-w/2;y=cy+h/2-(d-2*w-h)}g.globalCompositeOperation='lighter';glow(x,y,60,hs(HU,90,80,.9))},
flicker(){const s=36;for(let y=0;y<H;y+=s)for(let x=0;x<W;x+=s){const r=R(),on=Math.sin(t*2+r*40)>.85;g.fillStyle=on?hs(HU,90,60,.4+.5*r):'rgba(255,255,255,.04)';g.fillRect(x+3,y+3,s-6,s-6)}},
lightning(){g.globalCompositeOperation='lighter';const fl=(t*1.3)%1<.25;let sd2=Math.floor(t*1.3)*77+SD;const r2=()=>((sd2=(sd2*16807)%2147483647)/2147483647);if(fl){g.fillStyle=hs(HU,60,70,.08);g.fillRect(0,0,W,H)}
 for(let b=0;b<3;b++){let x=cx+(r2()-.5)*W*.4,y=0;g.strokeStyle=hs(HU,90,fl?85:60,fl?1:.35);g.lineWidth=fl?5:2;g.shadowColor=hs(HU,90,60);g.shadowBlur=fl?40:10;g.beginPath();g.moveTo(x,y);while(y<H){x+=(r2()-.5)*120;y+=40+r2()*60;g.lineTo(x,y)}g.stroke()}g.shadowBlur=0},
ocean(){const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,hs(HU+20,50,70));gr.addColorStop(.45,hs(HU,40,60));gr.addColorStop(.46,hs(HU,60,30));gr.addColorStop(1,hs(HU,70,10));g.fillStyle=gr;g.fillRect(0,0,W,H);g.strokeStyle='rgba(255,255,255,.25)';for(let j=0;j<40;j++){const y=H*.46+Math.pow(j/40,1.6)*H*.54;g.lineWidth=1+j/12;g.beginPath();for(let i=0;i<=60;i++){const x=i/60*W;g.lineTo(x,y+Math.sin(i*.6+j+t*2)*4*(1+j/10))}g.stroke()}glow(W*.7,H*.25,M*.15,'rgba(255,240,200,.9)')},
flock(){for(let i=0;i<160;i++){const ox=(R()-.5)*W*.8*R(),oy=(R()-.5)*H*.7*R(),ph=R()*6;const x=(cx+ox+t*90+W)%W,y=cy+oy+Math.sin(t*1.5+ph)*20,a=-.1+Math.sin(t*1.5+ph)*.2;g.save();g.translate(x,y);g.rotate(a);g.fillStyle=hs(HU,30,80,.9);const fl=Math.sin(t*12+ph)*5;g.beginPath();g.moveTo(16,0);g.lineTo(-10,-7-fl);g.lineTo(-6,0);g.lineTo(-10,7+fl);g.fill();g.restore()}},
metaballs(){for(let i=0;i<7;i++){const bx=(R()-.5)*M*.8,by=(R()-.5)*M*.6,r=M*(.08+R()*.12),ph=R()*6;const x=cx+bx+Math.sin(t*.9+ph)*M*.12,y=cy+by+Math.cos(t*.7+ph)*M*.1;const gr=g.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r);gr.addColorStop(0,hs(HU,90,85));gr.addColorStop(1,hs(HU+40,80,35));g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill()}},
lamp(){g.globalCompositeOperation='lighter';const y=H*.42,k=.6+.4*Math.min(1,(t%5)/1.2),w=M*.35*k;g.fillStyle=hs(HU,90,70);g.fillRect(cx-w,y,2*w,6);const gr=g.createLinearGradient(0,y,0,0);gr.addColorStop(0,hs(HU,90,60,.6));gr.addColorStop(1,hs(HU,90,60,0));g.fillStyle=gr;g.beginPath();g.moveTo(cx-w,y);g.lineTo(cx+w,y);g.lineTo(cx+w*2,0);g.lineTo(cx-w*2,0);g.fill();glow(cx,y,M*.3*k,hs(HU,90,70,.5))},
bloom(){g.globalCompositeOperation='lighter';for(let i=0;i<6;i++){const bx=W*(.15+R()*.7),by=H*(.2+R()*.6),r=M*(.05+R()*.08),ph=R()*6;const x=bx+Math.sin(t*.6+ph)*40,y=by+Math.cos(t*.5+ph)*30,p=1+.25*Math.sin(t*2+ph);glow(x,y,r*4*p,hs(HU+i*20,90,60,.5));g.fillStyle=hs(HU+i*20,90,85);g.beginPath();g.arc(x,y,r,0,7);g.fill()}},
doodle(){g.strokeStyle=hs(HU,80,75);g.lineWidth=8;g.lineCap='round';const prog=(t*.4)%1.3;for(let s=0;s<6;s++){let x=W*(.15+R()*.7),y=H*(.2+R()*.6);g.beginPath();g.moveTo(x,y);for(let i=0;i<10;i++){x+=(R()-.5)*160;y+=(R()-.5)*120;if((s*10+i)/60<prog)g.lineTo(x,y)}g.stroke()}},
sequencer(){const c=16,r=6,w=W*.8/c,h=H*.6/r,col=Math.floor(t*6)%c;for(let j=0;j<r;j++)for(let i=0;i<c;i++){const on=R()<.3;g.fillStyle=on?hs(HU+j*45,85,i===col?80:55):(i===col?'rgba(255,255,255,.18)':'rgba(255,255,255,.07)');g.beginPath();g.roundRect(W*.1+i*w+4,H*.2+j*h+4,w-8,h-8,10);g.fill()}},
pose(){const sw=Math.sin(t*2);const P=[[0,-1.2],[0,-.6],[-.5,-.4],[-.8-.2*sw,-.4*sw],[.5,-.4],[.9+.1*sw,-.8+.5*sw],[0,.3],[-.35,1.1],[.35,1.1]],E=[[0,1],[1,2],[2,3],[1,4],[4,5],[1,6],[6,7],[6,8]];const s=M*.28;g.strokeStyle=hs(HU,90,65);g.lineWidth=10;E.forEach(([a,b])=>{g.beginPath();g.moveTo(cx+P[a][0]*s,cy+P[a][1]*s);g.lineTo(cx+P[b][0]*s,cy+P[b][1]*s);g.stroke()});P.forEach(p=>glow(cx+p[0]*s,cy+p[1]*s,26,hs(HU+60,90,75)))},
iconcloud(){for(let i=0;i<90;i++){const a=R()*6.28+t*.5,b=Math.acos(2*R()-1),r=M*.36,z=Math.sin(a)*Math.sin(b);const s=18+z*14;g.globalAlpha=.4+.6*(z+1)/2;g.fillStyle=hs(HU+i*7,70,60);g.beginPath();g.roundRect(cx+r*Math.cos(a)*Math.sin(b)-s,cy+r*Math.cos(b)-s,2*s,2*s,8);g.fill()}g.globalAlpha=1},
transmission(){D.bloom();g.globalCompositeOperation='source-over';const x=cx+Math.sin(t*.7)*60;const gr=g.createRadialGradient(x-60,cy-60,20,x,cy,M*.3);gr.addColorStop(0,'rgba(255,255,255,.55)');gr.addColorStop(.6,hs(HU,60,70,.15));gr.addColorStop(1,'rgba(255,255,255,.35)');g.fillStyle=gr;g.beginPath();g.arc(x,cy,M*.3,0,7);g.fill()},
scroll3d(){const o=(t*.4)%1;for(let i=0;i<7;i++){const z=(i+o)/7;g.fillStyle=hs(HU+i*20,50,15+z*35,.9);const w=W*(.2+z*.6),h=H*(.15+z*.45);g.beginPath();g.roundRect(cx-w/2,cy-h/2+(z-.5)*H*.3,w,h,20);g.fill()}},
};
function frame(){sd=SD*9301+49297;g.save();g.globalCompositeOperation='source-over';g.globalAlpha=1;g.filter='none';g.shadowBlur=0;
g.fillStyle='#070A10';g.fillRect(0,0,W,H);
const bg=g.createRadialGradient(W*.5,H*.55,0,W*.5,H*.55,W*.7);bg.addColorStop(0,hs(HU,40,12));bg.addColorStop(1,'#05070B');g.fillStyle=bg;g.fillRect(0,0,W,H);
(D[K]||D.particles)();g.restore()}
if(LIVE){const t0=performance.now();let last=0;(function f(n){if(n-last>32){last=n;t=(n-t0)/1000;frame()}requestAnimationFrame(f)})(t0)}else frame();
if(window.parent!==window){const fwd=(key)=>{try{parent.document.dispatchEvent(new KeyboardEvent('keydown',{key,bubbles:true}));parent.focus()}catch(e){}};addEventListener('keydown',e=>{e.preventDefault();fwd(e.key)});addEventListener('click',()=>fwd('ArrowRight'))}
</script></body></html>
