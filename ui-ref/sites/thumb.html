<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>효과 개념도</title>
<style>html,body{margin:0;height:100%;background:#070A10;overflow:hidden}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas>
<script>
/* 2번 교안: 레퍼런스 사이트의 효과를 「개념도」로 그림 (실제 화면 캡처 아님). ?k=종류&h=색상(0~360)&s=씨앗&t=시간 */
const q=new URLSearchParams(location.search),K=q.get('k')||'particles',HU=+(q.get('h')||210),SD=+(q.get('s')||1);
const cv=document.getElementById('c'),g=cv.getContext('2d');const W=cv.width=innerWidth*2,H=cv.height=innerHeight*2;
let sd=SD*9301+49297;const R=()=>((sd=(sd*16807)%2147483647)/2147483647);
const hs=(h,s,l,a=1)=>`hsla(${(h+360)%360},${s}%,${l}%,${a})`;
const glow=(x,y,r,col)=>{const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,2*r,2*r)};
g.fillStyle='#070A10';g.fillRect(0,0,W,H);
const bg=g.createRadialGradient(W*.5,H*.55,0,W*.5,H*.55,W*.7);bg.addColorStop(0,hs(HU,40,12));bg.addColorStop(1,'#05070B');g.fillStyle=bg;g.fillRect(0,0,W,H);
const cx=W/2,cy=H/2,M=Math.min(W,H);
const D={
particles(){g.globalCompositeOperation='lighter';for(let i=0;i<700;i++){const x=R()*W,y=R()*H,r=R()*3+1;glow(x,y,r*4,hs(HU+R()*40,90,65,.5))}},
waves(){g.globalCompositeOperation='lighter';for(let j=0;j<40;j++)for(let i=0;i<70;i++){const z=j/40,x=cx+(i-35)*W/60*(.3+z),y=H*.35+z*H*.6+Math.sin(i*.35+j*.4)*30*(.3+z);glow(x,y,6*(.3+z),hs(HU+z*40,90,65,.6))}},
beams(){g.globalCompositeOperation='lighter';for(let i=0;i<14;i++){const sx=R()*W,sy=H*(.1+R()*.8);g.strokeStyle=hs(HU+i*6,90,60,.55);g.lineWidth=3;g.beginPath();g.moveTo(sx<cx?0:W,sy);g.bezierCurveTo(cx*(sx<cx?.5:1.5),sy,cx,cy,cx,cy);g.stroke()}glow(cx,cy,M*.12,hs(HU,90,75,.9))},
globe(){const r=M*.36;g.strokeStyle=hs(HU,70,55,.35);g.lineWidth=2;for(let i=-6;i<=6;i++){g.beginPath();g.ellipse(cx,cy,r*Math.cos(i/14*Math.PI),r,0,0,7);g.stroke();g.beginPath();g.ellipse(cx,cy+i*r/7,r*Math.sqrt(1-Math.pow(i/7,2)),r*.12,0,0,7);g.stroke()}
 g.globalCompositeOperation='lighter';for(let i=0;i<500;i++){const a=R()*6.28,b=Math.acos(2*R()-1);if(Math.sin(a)*Math.sin(b)<0)continue;glow(cx+r*Math.cos(a)*Math.sin(b),cy+r*Math.cos(b),5,hs(HU+30,90,70,.8))}
 for(let i=0;i<5;i++){g.strokeStyle=hs(HU+120,90,65,.8);g.lineWidth=3;const a=cx-r*.6+R()*r*1.2,b=cy-r*.5+R()*r;g.beginPath();g.moveTo(a,b);g.quadraticCurveTo(cx,cy-r*1.1,cx-r*.5+R()*r,cy-r*.5+R()*r);g.stroke()}},
retrogrid(){g.strokeStyle=hs(HU,90,60,.7);g.lineWidth=2.5;const hy=H*.48;for(let i=-20;i<=20;i++){g.beginPath();g.moveTo(cx+i*40,hy);g.lineTo(cx+i*260,H);g.stroke()}for(let j=1;j<14;j++){const y=hy+(H-hy)*Math.pow(j/14,2);g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}glow(cx,hy,M*.4,hs(HU+40,90,60,.5))},
card3d(){g.save();g.translate(cx,cy);g.transform(1,-.12,.25,1,0,0);g.shadowColor='#000';g.shadowBlur=80;g.shadowOffsetY=50;const w=M*.9,h=M*.6;const gr=g.createLinearGradient(-w/2,-h/2,w/2,h/2);gr.addColorStop(0,hs(HU,70,45));gr.addColorStop(1,hs(HU+60,70,20));g.fillStyle=gr;g.beginPath();g.roundRect(-w/2,-h/2,w,h,40);g.fill();g.shadowBlur=0;g.fillStyle='rgba(255,255,255,.12)';g.beginPath();g.roundRect(-w/2+50,-h/2+50,w*.45,h*.4,20);g.fill();g.fillStyle='rgba(255,255,255,.6)';g.fillRect(-w/2+50,h/2-120,w*.5,18);g.fillRect(-w/2+50,h/2-80,w*.3,14);g.restore()},
spotlight(){g.globalCompositeOperation='lighter';const gr=g.createLinearGradient(cx,0,cx,H);gr.addColorStop(0,hs(HU,80,75,.55));gr.addColorStop(1,hs(HU,80,50,0));g.fillStyle=gr;g.beginPath();g.moveTo(cx-40,0);g.lineTo(cx+40,0);g.lineTo(cx+W*.45,H);g.lineTo(cx-W*.1,H);g.fill();glow(cx,0,M*.3,hs(HU,90,80,.6))},
textfx(){g.font=`900 ${M*.5}px system-ui`;g.textAlign='center';g.textBaseline='middle';const gr=g.createLinearGradient(cx-M*.6,0,cx+M*.6,0);gr.addColorStop(0,hs(HU,90,60));gr.addColorStop(.5,'#fff');gr.addColorStop(1,hs(HU+80,90,60));g.fillStyle=gr;g.shadowColor=hs(HU,90,60);g.shadowBlur=60;g.fillText('Aa',cx,cy)},
blobs(){g.filter='blur(60px)';for(let i=0;i<6;i++){g.fillStyle=hs(HU+i*35,80,55,.8);g.beginPath();g.ellipse(R()*W,R()*H,M*(.25+R()*.3),M*(.15+R()*.2),R()*3,0,7);g.fill()}g.filter='none'},
tunnel(){g.globalCompositeOperation='lighter';for(let i=0;i<260;i++){const a=R()*6.28,r1=M*(.05+R()*.3),r2=r1+M*(.2+R()*.6);g.strokeStyle=hs(HU+(R()<.5?0:150),95,60,.7);g.lineWidth=2+R()*4;g.beginPath();g.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1*.6);g.lineTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2*.6);g.stroke()}},
ripple(){for(let i=1;i<9;i++){g.strokeStyle=hs(HU,80,60,1-i/9);g.lineWidth=4;g.beginPath();g.arc(cx,cy,i*M*.06,0,7);g.stroke()}glow(cx,cy,M*.1,hs(HU,90,70))},
orbit(){for(let i=1;i<4;i++){g.strokeStyle=hs(HU,50,50,.4);g.setLineDash([12,14]);g.lineWidth=2;g.beginPath();g.arc(cx,cy,i*M*.13,0,7);g.stroke();g.setLineDash([]);for(let k=0;k<i+2;k++){const a=R()*6.28;g.fillStyle=hs(HU+k*30,70,60);g.beginPath();g.arc(cx+Math.cos(a)*i*M*.13,cy+Math.sin(a)*i*M*.13,22,0,7);g.fill()}}glow(cx,cy,M*.08,hs(HU,90,70))},
terrain(){g.strokeStyle=hs(HU,90,60,.8);g.lineWidth=2;for(let j=0;j<30;j++){g.beginPath();for(let i=0;i<=80;i++){const z=j/30,x=i/80*W,y=H*.35+z*H*.65-(Math.sin(i*.2+j*.3)+Math.sin(i*.07-j*.2)*1.6+1.5)*60*(1-z*.4);i?g.lineTo(x,y):g.moveTo(x,y)}g.stroke()}},
noise(){const s=14;for(let y=0;y<H;y+=s)for(let x=0;x<W;x+=s){const v=(Math.sin(x*.004+y*.006)+Math.sin(x*.009-y*.003)+2)/4;if(R()<v){g.fillStyle=hs(HU,60,20+v*60);g.fillRect(x,y,s-2,s-2)}}},
gallery(){for(let i=0;i<9;i++){const a=(i/9-.5)*2.4,x=cx+Math.sin(a)*W*.42,y=cy+(1-Math.cos(a))*H*.25,s=1-Math.abs(a)*.25;g.save();g.translate(x,y);g.rotate(a*.3);g.fillStyle=hs(HU+i*25,60,45);g.beginPath();g.roundRect(-110*s,-150*s,220*s,300*s,18);g.fill();g.restore()}},
trail(){for(let i=0;i<14;i++){const t=i/13,x=W*(.1+.8*t),y=cy+Math.sin(t*6)*H*.25;g.globalAlpha=.2+.8*t;g.fillStyle=hs(HU+i*12,60,50);g.beginPath();g.roundRect(x-90,y-120,180,240,14);g.fill()}g.globalAlpha=1},
glass(){D.blobs();g.fillStyle='rgba(255,255,255,.1)';g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=3;g.beginPath();g.roundRect(cx-M*.45,cy-M*.3,M*.9,M*.6,40);g.fill();g.stroke()},
flicker(){const s=36;for(let y=0;y<H;y+=s)for(let x=0;x<W;x+=s){g.fillStyle=R()<.12?hs(HU,90,60,.3+R()*.6):'rgba(255,255,255,.04)';g.fillRect(x+3,y+3,s-6,s-6)}},
lightning(){g.globalCompositeOperation='lighter';for(let b=0;b<3;b++){let x=cx+(R()-.5)*W*.4,y=0;g.strokeStyle=hs(HU,90,80);g.lineWidth=5;g.shadowColor=hs(HU,90,60);g.shadowBlur=40;g.beginPath();g.moveTo(x,y);while(y<H){x+=(R()-.5)*120;y+=40+R()*60;g.lineTo(x,y)}g.stroke()}g.shadowBlur=0},
ocean(){const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,hs(HU+20,50,70));gr.addColorStop(.45,hs(HU,40,60));gr.addColorStop(.46,hs(HU,60,30));gr.addColorStop(1,hs(HU,70,10));g.fillStyle=gr;g.fillRect(0,0,W,H);g.strokeStyle='rgba(255,255,255,.25)';for(let j=0;j<40;j++){const y=H*.46+Math.pow(j/40,1.6)*H*.54;g.lineWidth=1+j/12;g.beginPath();for(let i=0;i<=60;i++){const x=i/60*W;g.lineTo(x,y+Math.sin(i*.6+j)*4*(1+j/10))}g.stroke()}glow(W*.7,H*.25,M*.15,'rgba(255,240,200,.9)')},
flock(){for(let i=0;i<180;i++){const x=cx+(R()-.5)*W*.8*R(),y=cy+(R()-.5)*H*.7*R(),a=-.4+R()*.3;g.save();g.translate(x,y);g.rotate(a);g.fillStyle=hs(HU,30,80,.9);g.beginPath();g.moveTo(16,0);g.lineTo(-10,-7);g.lineTo(-6,0);g.lineTo(-10,7);g.fill();g.restore()}},
metaballs(){for(let i=0;i<7;i++){const x=cx+(R()-.5)*M*.8,y=cy+(R()-.5)*M*.6,r=M*(.08+R()*.12);const gr=g.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r);gr.addColorStop(0,hs(HU,90,85));gr.addColorStop(1,hs(HU+40,80,35));g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill()}},
lamp(){g.globalCompositeOperation='lighter';const y=H*.42;g.fillStyle=hs(HU,90,70);g.fillRect(cx-M*.35,y,M*.7,6);const gr=g.createLinearGradient(0,y,0,0);gr.addColorStop(0,hs(HU,90,60,.6));gr.addColorStop(1,hs(HU,90,60,0));g.fillStyle=gr;g.beginPath();g.moveTo(cx-M*.35,y);g.lineTo(cx+M*.35,y);g.lineTo(cx+M*.7,0);g.lineTo(cx-M*.7,0);g.fill();glow(cx,y,M*.3,hs(HU,90,70,.5))},
bloom(){g.globalCompositeOperation='lighter';for(let i=0;i<6;i++){const x=W*(.15+R()*.7),y=H*(.2+R()*.6),r=M*(.05+R()*.08);glow(x,y,r*4,hs(HU+i*20,90,60,.5));g.fillStyle=hs(HU+i*20,90,85);g.beginPath();g.arc(x,y,r,0,7);g.fill()}},
doodle(){g.strokeStyle=hs(HU,80,75);g.lineWidth=8;g.lineCap='round';for(let s=0;s<6;s++){let x=W*(.15+R()*.7),y=H*(.2+R()*.6);g.beginPath();g.moveTo(x,y);for(let i=0;i<10;i++){x+=(R()-.5)*160;y+=(R()-.5)*120;g.lineTo(x,y)}g.stroke()}},
sequencer(){const c=16,r=6,w=W*.8/c,h=H*.6/r;for(let j=0;j<r;j++)for(let i=0;i<c;i++){g.fillStyle=R()<.3?hs(HU+j*45,85,60):'rgba(255,255,255,.07)';g.beginPath();g.roundRect(W*.1+i*w+4,H*.2+j*h+4,w-8,h-8,10);g.fill()}},
pose(){const P=[[0,-1.2],[0,-.6],[-.5,-.4],[-.8,0],[.5,-.4],[.9,-.8],[0,.3],[-.35,1.1],[.35,1.1]],E=[[0,1],[1,2],[2,3],[1,4],[4,5],[1,6],[6,7],[6,8]];const s=M*.28;g.strokeStyle=hs(HU,90,65);g.lineWidth=10;E.forEach(([a,b])=>{g.beginPath();g.moveTo(cx+P[a][0]*s,cy+P[a][1]*s);g.lineTo(cx+P[b][0]*s,cy+P[b][1]*s);g.stroke()});P.forEach(p=>glow(cx+p[0]*s,cy+p[1]*s,26,hs(HU+60,90,75)))},
iconcloud(){for(let i=0;i<90;i++){const a=R()*6.28,b=Math.acos(2*R()-1),r=M*.36,z=Math.sin(a)*Math.sin(b);const s=18+z*14;g.globalAlpha=.4+.6*(z+1)/2;g.fillStyle=hs(HU+i*7,70,60);g.beginPath();g.roundRect(cx+r*Math.cos(a)*Math.sin(b)-s,cy+r*Math.cos(b)-s,2*s,2*s,8);g.fill()}g.globalAlpha=1},
transmission(){D.bloom();g.globalCompositeOperation='source-over';const gr=g.createRadialGradient(cx-60,cy-60,20,cx,cy,M*.3);gr.addColorStop(0,'rgba(255,255,255,.55)');gr.addColorStop(.6,hs(HU,60,70,.15));gr.addColorStop(1,'rgba(255,255,255,.35)');g.fillStyle=gr;g.beginPath();g.arc(cx,cy,M*.3,0,7);g.fill()},
scroll3d(){for(let i=0;i<6;i++){const z=i/6;g.fillStyle=hs(HU+i*20,50,20+z*30,.9);const w=W*(.25+z*.5),h=H*(.2+z*.4);g.beginPath();g.roundRect(cx-w/2,cy-h/2+(i-3)*30,w,h,20);g.fill()}},
};
(D[K]||D.particles)();
</script></body></html>
