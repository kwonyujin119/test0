<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>영상 작업장</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%2316171a'/><text x='50' y='69' font-size='54' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'>영</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script>try{var t=localStorage.getItem('ws:theme');if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="app/ui.css">
<link rel="stylesheet" href="app/hub.css">
<link rel="stylesheet" href="app/video/home.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="app/icons/icon-192.png">
</head>
<body>
<div id="vhGate" hidden>
  <div class="vh-gate">
    <span class="mark" aria-hidden="true">영</span>
    <h1>영상 작업장은 관리자만 씁니다</h1>
    <p>게스트 모드는 보기 전용입니다. 영상을 편집하려면 접속코드를 입력해 주세요.</p>
    <div class="vh-row"><a class="btn" href="index.html"><i data-ic="back"></i>업무 공간으로</a><button class="btn ink" id="gateIn"><i data-ic="key"></i>관리자로 입장</button></div>
  </div>
</div>
<div class="shell" id="vhApp">
  <aside class="rail" aria-label="영상 작업장 메뉴">
    <a class="brand" href="videos.html"><span class="mark">영</span><b>영상 작업장</b></a>
    <div class="rail-role" id="roleChip"></div>
    <button class="btn ink wide" id="btnNew"><i data-ic="plus"></i>새 영상</button>
    <nav class="rail-nav" id="nav" aria-label="영상 분류">
      <button class="rail-item on" data-filter="all"><i data-ic="stack"></i><span>모든 영상</span><em id="cAll"></em></button>
      <button class="rail-item" data-filter="week"><i data-ic="clock"></i><span>최근 7일</span><em id="cWeek"></em></button>
      <button class="rail-item" data-filter="remote" id="navRemote" hidden><i data-ic="cloud"></i><span>다른 기기에서</span><em id="cRemote"></em></button>
      <button class="rail-item" data-filter="unsent" id="navUnsent" hidden><i data-ic="upload"></i><span>아직 안 올라감</span><em id="cUnsent"></em></button>
    </nav>
    <div class="rail-grow"></div>
    <nav class="rail-nav quiet" aria-label="도구">
      <button class="rail-item" id="btnImport" title="영상 · 사진 · 소리 파일로 새 영상을 시작합니다"><i data-ic="import"></i><span>파일 가져오기</span></button>
      <button class="rail-item" id="btnRec" title="화면이나 카메라를 녹화해 새 영상을 시작합니다"><i data-ic="record"></i><span>녹화로 시작</span></button>
      <button class="rail-item" id="btnSync" title="휴대폰 · PC 에서 같은 영상 프로젝트를 이어서 편집"><i data-ic="cloud"></i><span>다른 기기와 연결</span><em id="syncState"></em></button>
      <a class="rail-item" href="index.html"><i data-ic="back"></i><span>업무 공간으로</span></a>
    </nav>
  </aside>

  <main class="hub">
    <header class="hub-bar">
      <h1 id="pageTitle">모든 영상</h1>
      <span class="hub-count" id="sub"></span>
      <div class="hub-tools">
        <label class="searchbox"><i data-ic="search"></i><input type="search" id="q" placeholder="영상 검색" aria-label="영상 검색"><kbd>/</kbd></label>
        <select id="sort" aria-label="정렬">
          <option value="recent">최근 저장순</option>
          <option value="title">제목순</option>
          <option value="long">긴 영상 순</option>
        </select>
        <div class="seg" role="group" aria-label="보기 방식">
          <button class="seg-b on" data-view="grid" title="격자로 보기" aria-label="격자로 보기"><i data-ic="gallery"></i></button>
          <button class="seg-b" data-view="list" title="목록으로 보기" aria-label="목록으로 보기"><i data-ic="rows"></i></button>
        </div>
        <button class="btn icon ghost" data-ui-theme title="화면을 어둡게"></button>
      </div>
    </header>
    <div class="hub-notice" id="notice" style="display:none"></div>
    <section class="resume vh-resume" id="resume" style="display:none" aria-label="이어서 작업"></section>
    <h2 class="hub-h2" id="gridHead" style="display:none">다른 영상</h2>
    <div class="deck-grid vh-grid" id="grid"></div>
    <div class="hub-empty" id="empty" style="display:none"></div>
  </main>
</div>
<input type="file" id="fileImport" accept="video/*,audio/*,image/*" multiple style="display:none">
<script src="app/common.js"></script>
<script src="app/access.js"></script>
<script src="app/video/core.js"></script>
<script src="app/video/sync.js"></script>
<script src="app/video/home.js"></script>
<script src="app/pwa.js"></script>
</body>
</html>
