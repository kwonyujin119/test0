<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="app/ui.css"><link rel="stylesheet" href="app/slide.css">
<style>body{margin:0;background:#8a8f96;padding:14px}
#g{display:grid;grid-template-columns:repeat(3,480px);gap:12px}
.cell{width:480px;height:270px;overflow:hidden;position:relative;background:#fff;outline:2px solid #333}
.cell .slide{transform:scale(0.25);transform-origin:0 0;position:absolute;top:0;left:0}
.lbl{position:absolute;right:3px;top:3px;z-index:99;background:#111;color:#fff;font:700 14px sans-serif;padding:2px 8px;border-radius:3px}</style>
</head><body><div id="g"></div>
<script src="app/common.js"></script>
<script>
(async function(){
  const deck = await (await fetch('decks/'+encodeURIComponent('소방 용수의 이해.json'))).json();
  const q = new URLSearchParams(location.search);
  const only = (q.get('s')||'').split(',').filter(x=>x!=='').map(Number);
  const st = q.get('step')===null?99:Number(q.get('step'));
  const g = document.getElementById('g');
  window.__err=[];
  deck.slides.forEach((s,i)=>{
    if (only.length && !only.includes(i)) return;
    const c=document.createElement('div'); c.className='cell';
    const l=document.createElement('div'); l.className='lbl'; l.textContent=(i+1); c.appendChild(l);
    try { c.appendChild(renderSlide(s, deck, {mode:'present', step:st})); }
    catch(err){ window.__err.push(i+1+': '+err.message); }
    g.appendChild(c);
  });
  document.title='ready';
})();
</script></body></html>
